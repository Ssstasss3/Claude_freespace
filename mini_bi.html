<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini BI</title>
<!--
  Mini BI — a single-file, dependency-free report builder in the spirit of
  Power BI. Opus 5.5, September 2026.

  The core loop: pick a field -> it lands in a visual's well -> the visual
  renders -> click any bar, slice or row and every other visual cross-filters.
  Measures use a tiny DAX-like language: SUM, AVERAGE, MIN, MAX, COUNT,
  DISTINCTCOUNT, COUNTROWS, DIVIDE, + - * /, and [Other Measure] references.

  All data is generated from a fixed seed, so every visitor sees the same numbers.
-->
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f1f0ec;
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
    --accent: #2a78d6; --accent-wash: rgba(42,120,214,0.09); --on-accent: #ffffff;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
    --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
    --other: #b3b1a9; --critical: #d03b3b; --good: #006300;
    --shadow: 0 8px 28px rgba(0,0,0,0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --surface-2: #242423;
      --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
      --accent: #3987e5; --accent-wash: rgba(57,135,229,0.14); --on-accent: #ffffff;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
      --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
      --other: #5e5d58; --critical: #e66767; --good: #0ca30c;
      --shadow: 0 8px 28px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #242423;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --accent: #3987e5; --accent-wash: rgba(57,135,229,0.14); --on-accent: #ffffff;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --other: #5e5d58; --critical: #e66767; --good: #0ca30c;
    --shadow: 0 8px 28px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--page); color: var(--ink);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  button, input, select, textarea { font: inherit; color: var(--ink); }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* ribbon */
  .ribbon {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 14px; background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 7px; font-weight: 650; font-size: 14px; margin-right: 6px; }
  .brand svg { color: var(--accent); }
  .tabs { display: flex; gap: 2px; background: var(--surface-2); padding: 3px; border-radius: 8px; }
  .tabs button { border: 0; background: transparent; padding: 5px 11px; border-radius: 6px; color: var(--ink-2); }
  .tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.12); }
  .spacer { flex: 1; }
  .btn {
    border: 1px solid var(--border); background: var(--surface); border-radius: 7px;
    padding: 5px 10px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: transparent; color: var(--on-accent); }
  .btn.warn { color: var(--critical); }
  .icon-btn { border: 0; background: transparent; padding: 4px; border-radius: 5px; color: var(--muted); display: inline-grid; place-items: center; }
  .icon-btn:hover { background: var(--surface-2); color: var(--ink); }

  /* layout */
  .main { flex: 1; display: flex; min-height: 0; }
  .report { flex: 1; min-width: 0; overflow: auto; padding: 14px 16px 24px; }
  .panes { width: 300px; flex: none; overflow-y: auto; background: var(--surface); border-left: 1px solid var(--border); }
  body.reading .panes { display: none; }

  .report-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .report-head h1 { font-size: 18px; margin: 0; font-weight: 650; }
  .report-head .meta { color: var(--muted); font-size: 12px; }

  /* filter row */
  .filterbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 12px; }
  .fb-label { color: var(--ink-2); font-size: 12px; margin-right: 2px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
    border: 1px solid var(--border); background: var(--surface); border-radius: 999px;
    padding: 3px 6px 3px 11px; font-size: 12px;
  }
  .chip:hover { background: var(--surface-2); }
  .chip b { font-weight: 600; }
  .chip .src { color: var(--muted); }
  .chip .vals { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
  .chip.add { padding-right: 11px; color: var(--ink-2); border-style: dashed; }
  .chip .x { border: 0; background: transparent; color: var(--muted); padding: 0 3px; border-radius: 50%; line-height: 1; font-size: 14px; }
  .chip .x:hover { color: var(--ink); }
  .linkish { border: 0; background: transparent; color: var(--accent); font-size: 12px; padding: 3px 4px; }

  /* canvas */
  .canvas { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px; align-content: start; }
  .visual {
    grid-column: span 6; min-width: 0; position: relative;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px 12px;
  }
  .visual[data-span="3"] { grid-column: span 3; }
  .visual[data-span="4"] { grid-column: span 4; }
  .visual[data-span="8"] { grid-column: span 8; }
  .visual[data-span="12"] { grid-column: span 12; }
  body:not(.reading) .visual.sel { outline: 2px solid var(--accent); outline-offset: -1px; }
  .vh { display: flex; align-items: center; gap: 4px; min-height: 24px; margin-bottom: 4px; }
  .vt { flex: 1; min-width: 0; margin: 0; font-size: 13px; font-weight: 600; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vacts { display: flex; gap: 1px; opacity: 0; transition: opacity 0.12s; }
  .visual:hover .vacts, .visual:focus-within .vacts, .visual.sel .vacts { opacity: 1; }
  body.reading .vacts [data-act="del"] { display: none; }
  @media (hover: none) { body.reading .vacts, .visual.sel .vacts { opacity: 1; } }
  .vacts .on { color: var(--accent); }

  .empty { display: grid; place-items: center; text-align: center; color: var(--muted); min-height: 150px; padding: 12px; }
  .empty svg { margin-bottom: 6px; }
  .note { color: var(--ink-2); background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: 12px; margin: 8px 0; }

  /* charts */
  .vb svg { display: block; }
  .gl { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
  .bl { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }
  .tk { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .cl { fill: var(--ink-2); font-size: 12px; }
  .dl { fill: var(--ink-2); font-size: 11px; font-weight: 600; }
  .hit { fill: transparent; cursor: pointer; }
  .hit:hover { fill: var(--accent-wash); }
  .mark { pointer-events: none; transition: opacity 0.15s; }
  .seg { cursor: pointer; transition: opacity 0.15s; }
  .seg:hover { opacity: 0.85; }
  .dim { opacity: 0.25; }
  .hl-band { fill: var(--accent-wash); }
  .lineov { fill: transparent; cursor: crosshair; }
  .xh { stroke: var(--axis); stroke-width: 1; }
  .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; pointer-events: none; }
  .legend { display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: 12px; color: var(--ink-2); margin: 0 0 6px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .sw.line { height: 2px; width: 12px; border-radius: 1px; }

  .kpi { padding: 4px 2px 2px; }
  .kpi-v { font-size: 30px; font-weight: 650; letter-spacing: -0.01em; line-height: 1.15; }
  .kpi-l { color: var(--ink-2); font-size: 12px; margin-top: 2px; }

  .donut-wrap { display: flex; gap: 16px; align-items: center; }
  .donut-wrap.stack { flex-direction: column; align-items: stretch; }
  .donut-wrap svg { flex: none; margin: 0 auto; }
  .dlist { flex: 1; min-width: 0; font-size: 12px; }
  .dlist div { display: flex; align-items: center; gap: 7px; padding: 3px 0; cursor: pointer; border-radius: 4px; }
  .dlist div:hover { background: var(--surface-2); }
  .dlist .nm { flex: 1; min-width: 0; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dlist .pc { color: var(--muted); font-variant-numeric: tabular-nums; }
  .dlist .vl { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 52px; text-align: right; }
  .dlist .dim { opacity: 0.4; }

  .tablewrap { max-height: 280px; overflow: auto; }
  table.dt { width: 100%; border-collapse: collapse; font-size: 12px; }
  .dt th {
    text-align: left; color: var(--ink-2); font-weight: 600; white-space: nowrap;
    border-bottom: 1px solid var(--axis); padding: 5px 6px; position: sticky; top: 0;
    background: var(--surface); cursor: pointer; user-select: none;
  }
  .dt th.n, .dt td.n { text-align: right; font-variant-numeric: tabular-nums; }
  .dt td { padding: 5px 6px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  .dt tbody tr { cursor: pointer; }
  .dt tbody tr:hover td { background: var(--surface-2); }
  .dt tbody tr.dim td { opacity: 0.35; }
  .dt tfoot td { font-weight: 650; border-top: 1px solid var(--axis); border-bottom: 0; position: sticky; bottom: 0; background: var(--surface); }
  .dt .arrow { color: var(--accent); }

  /* panes */
  .pane { padding: 12px 14px 14px; border-bottom: 1px solid var(--border); }
  .pane h2 { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 600; display: flex; align-items: center; }
  .pane h2 .spacer { flex: 1; }
  .types { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
  .types button {
    aspect-ratio: 1; border: 1px solid var(--border); background: var(--surface); border-radius: 7px;
    display: grid; place-items: center; color: var(--ink-2); padding: 0;
  }
  .types button:hover { background: var(--surface-2); }
  .types button.on { border-color: var(--accent); color: var(--accent); background: var(--accent-wash); }
  .hint { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
  .well { margin-top: 10px; }
  .well-l { font-size: 12px; color: var(--ink-2); margin-bottom: 4px; }
  .drop { border: 1px dashed var(--axis); border-radius: 7px; padding: 4px; min-height: 34px; display: flex; flex-direction: column; gap: 4px; }
  .drop.over { border-color: var(--accent); background: var(--accent-wash); }
  .drop .ph { color: var(--muted); font-size: 12px; padding: 5px 6px; }
  .wchip { display: flex; align-items: center; gap: 4px; background: var(--surface-2); border-radius: 5px; padding: 3px 3px 3px 8px; font-size: 12px; }
  .wchip .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wchip select { border: 1px solid var(--border); background: var(--surface); border-radius: 4px; font-size: 11px; padding: 1px 2px; max-width: 110px; }
  .frow { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .frow label { width: 44px; color: var(--ink-2); font-size: 12px; flex: none; }
  .frow input, .frow select { flex: 1; min-width: 0; border: 1px solid var(--border); background: var(--surface); border-radius: 6px; padding: 4px 7px; }
  .seg-ctl { display: flex; flex: 1; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg-ctl button { flex: 1; border: 0; background: var(--surface); padding: 4px 0; color: var(--ink-2); font-size: 12px; }
  .seg-ctl button + button { border-left: 1px solid var(--border); }
  .seg-ctl button.on { background: var(--accent-wash); color: var(--accent); font-weight: 600; }

  .tbl-name { display: flex; align-items: center; gap: 6px; font-weight: 600; margin: 2px 0 4px; }
  .field {
    display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 6px; cursor: pointer;
    user-select: none; font-size: 13px;
  }
  .field:hover { background: var(--surface-2); }
  .field .fi { width: 20px; flex: none; text-align: center; color: var(--muted); font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .field .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .field .ck { width: 14px; height: 14px; border: 1px solid var(--axis); border-radius: 3px; flex: none; display: grid; place-items: center; }
  .field.used .ck { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .field .ops { display: none; }
  .field:hover .ops { display: flex; }
  .mform { border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-top: 8px; background: var(--page); }
  .mform input, .mform textarea, .mform select { width: 100%; border: 1px solid var(--border); background: var(--surface); border-radius: 6px; padding: 5px 7px; }
  .mform textarea { font: 12px/1.4 ui-monospace, "SF Mono", Menlo, monospace; height: 64px; resize: vertical; margin-top: 6px; }
  .mform .row { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
  .mform .msg { font-size: 12px; margin-top: 6px; min-height: 1.4em; }
  .msg.err { color: var(--critical); }
  .msg.ok { color: var(--good); }
  .mhelp { color: var(--muted); font-size: 11px; margin-top: 6px; line-height: 1.5; }
  .mhelp code { font-family: ui-monospace, Menlo, monospace; color: var(--ink-2); }

  /* tooltip + popover */
  .tip {
    position: fixed; z-index: 50; pointer-events: none; min-width: 150px; max-width: 280px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: var(--shadow); padding: 8px 10px; font-size: 12px;
  }
  .tt-h { color: var(--ink-2); margin-bottom: 4px; }
  .tt-r { display: flex; align-items: center; gap: 8px; padding: 1px 0; }
  .tt-v { font-weight: 650; font-variant-numeric: tabular-nums; }
  .tt-l { color: var(--ink-2); flex: 1; text-align: right; }
  .pop {
    position: fixed; z-index: 40; width: 240px; max-height: 340px; overflow: auto;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: var(--shadow); padding: 8px;
  }
  .pop h3 { font-size: 12px; margin: 2px 4px 6px; color: var(--ink-2); font-weight: 600; }
  .pop input[type="search"] { width: 100%; border: 1px solid var(--border); background: var(--surface); border-radius: 6px; padding: 4px 7px; margin-bottom: 4px; }
  .opt { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 6px; cursor: pointer; }
  .opt:hover { background: var(--surface-2); }
  .opt .ck { width: 16px; flex: none; color: var(--accent); font-weight: 800; text-align: center; }
  .pop .foot { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 6px; display: flex; justify-content: space-between; }

  /* responsive */
  @media (max-width: 1150px) {
    .visual[data-span="3"] { grid-column: span 6; }
    .visual[data-span="4"] { grid-column: span 6; }
    .visual[data-span="8"] { grid-column: span 12; }
  }
  @media (max-width: 820px) {
    .ribbon { padding: 8px 10px; gap: 6px; }
    .brand .txt, .btn .txt { display: none; }
    .report { padding: 12px 12px 24px; }
    .canvas { gap: 10px; }
    .visual, .visual[data-span] { grid-column: span 12; }
    .visual[data-type="card"] { grid-column: span 6; }
    .kpi-v { font-size: 24px; }
    .panes {
      position: fixed; left: 0; right: 0; bottom: 0; width: auto; height: 52vh; z-index: 20;
      border-left: 0; border-top: 1px solid var(--border); border-radius: 14px 14px 0 0; box-shadow: var(--shadow);
    }
    body:not(.reading) .report { padding-bottom: calc(52vh + 16px); }
  }
</style>
</head>
<body>
<header class="ribbon">
  <div class="brand"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="2" y="9" width="3.5" height="7" rx="1" fill="currentColor"/><rect x="7.25" y="5" width="3.5" height="11" rx="1" fill="currentColor" opacity=".75"/><rect x="12.5" y="2" width="3.5" height="14" rx="1" fill="currentColor" opacity=".5"/></svg><span class="txt">Mini BI</span></div>
  <nav class="tabs" id="dsTabs" role="tablist" aria-label="Dataset"></nav>
  <div class="spacer"></div>
  <button class="btn" id="newVisual" title="Add a visual"><span aria-hidden="true">＋</span><span class="txt">New visual</span></button>
  <button class="btn" id="resetBtn" title="Restore this dataset's starter report"><span aria-hidden="true">↺</span><span class="txt">Reset</span></button>
  <button class="btn primary" id="modeBtn"></button>
  <button class="icon-btn" id="themeBtn" aria-label="Toggle light or dark theme" title="Toggle theme"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M9 2.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button>
</header>

<div class="main">
  <section class="report" id="report" aria-label="Report canvas">
    <div class="report-head"><h1 id="reportTitle"></h1><span class="meta" id="reportMeta"></span></div>
    <div class="filterbar" id="filterbar"></div>
    <div class="canvas" id="canvas"></div>
  </section>
  <aside class="panes" id="panes" aria-label="Build panes">
    <div class="pane" id="vizPane"></div>
    <div class="pane" id="fieldsPane"></div>
  </aside>
</div>
<div class="tip" id="tip" hidden></div>
<div class="pop" id="pop" hidden></div>

<script>
'use strict';
// =====================================================================
// Utilities
// =====================================================================
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const trunc = (s, n) => (s = String(s), s.length > n ? s.slice(0, n - 1) + '…' : s);
let _uid = 0;
const uid = () => 'v' + (++_uid).toString(36) + Math.random().toString(36).slice(2, 6);
const OTHER = '(Other)';
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function monthList(from, n) {
  const [y, m] = from.split('-').map(Number);
  return Array.from({ length: n }, (_, i) => { const d = y * 12 + (m - 1) + i; return `${Math.floor(d / 12)}-${String(d % 12 + 1).padStart(2, '0')}`; });
}
const rnd = (v, d = 0) => Math.round(v * 10 ** d) / 10 ** d;

function compact(v) {
  const a = Math.abs(v);
  if (a >= 1e9) return rnd(v / 1e9, a >= 1e10 ? 0 : 1) + 'B';
  if (a >= 1e6) return rnd(v / 1e6, a >= 1e7 ? 0 : 1) + 'M';
  if (a >= 1e4) return rnd(v / 1e3, a >= 1e5 ? 0 : 1) + 'K';
  if (a >= 100) return Math.round(v).toLocaleString('en-US');
  return String(rnd(v, a >= 10 ? 1 : 2));
}
function full(v) { return Math.abs(v) >= 100 ? Math.round(v).toLocaleString('en-US') : v.toLocaleString('en-US', { maximumFractionDigits: 2 }); }
function fmtVal(v, fmt, mode = 'compact') {
  if (v == null || !isFinite(v)) return '—';
  if (fmt === 'percent') return `${rnd(v * 100, mode === 'compact' ? 1 : 2)}%`;
  const s = mode === 'compact' ? compact(v) : full(v);
  return fmt === 'currency' ? (v < 0 ? '−$' + s.slice(1) : '$' + s) : s;
}

// =====================================================================
// Dummy datasets (seeded, so they are identical on every load)
// =====================================================================
const F = (field, agg) => ({ kind: 'field', field, agg: agg || null });
const M = name => ({ kind: 'measure', name });
const V = (type, span, wells = {}) => ({ id: uid(), type, span, wells: { axis: [], values: [], legend: [], columns: [], ...wells } });

function makeSales() {
  const r = mulberry32(7);
  const regions = { North: 1.0, South: 0.78, East: 1.16, West: 0.9 };
  const cats = {
    Electronics: { base: 52000, price: 320, cost: 0.74 }, Furniture: { base: 31000, price: 410, cost: 0.63 },
    Clothing: { base: 27000, price: 48, cost: 0.52 }, Groceries: { base: 44000, price: 12, cost: 0.83 },
    Toys: { base: 15000, price: 29, cost: 0.61 },
  };
  const rows = [];
  monthList('2024-01', 24).forEach((mo, i) => {
    const m = +mo.slice(5);
    const season = 1 + 0.12 * Math.sin((m - 4) / 12 * 2 * Math.PI) + (m === 11 ? 0.22 : m === 12 ? 0.42 : 0);
    const growth = 1 + i * 0.01;
    for (const [reg, rm] of Object.entries(regions))
      for (const [cat, c] of Object.entries(cats))
        for (const ch of ['Online', 'Store']) {
          const chm = ch === 'Online' ? 0.55 * (1 + i * 0.035) : 1;          // online grows fast
          const rev = c.base * rm * chm * season * growth * (0.85 + r() * 0.3) / 2;
          const cost = rev * (c.cost + (ch === 'Online' ? 0.03 : 0)) * (0.95 + r() * 0.1);
          rows.push({ Month: mo, Region: reg, Category: cat, Channel: ch, Revenue: rnd(rev, 2), Cost: rnd(cost, 2), Profit: rnd(rev - cost, 2), Units: Math.max(1, Math.round(rev / c.price)) });
        }
  });
  return {
    id: 'sales', name: 'Retail Sales', short: 'Sales', table: 'Sales', rows,
    fields: [
      { name: 'Month', type: 'time' }, { name: 'Region', type: 'dim' }, { name: 'Category', type: 'dim' }, { name: 'Channel', type: 'dim' },
      { name: 'Revenue', type: 'num', fmt: 'currency' }, { name: 'Cost', type: 'num', fmt: 'currency' },
      { name: 'Profit', type: 'num', fmt: 'currency' }, { name: 'Units', type: 'num' },
    ],
    measures: [
      { name: 'Profit Margin', expr: 'DIVIDE(SUM([Profit]), SUM([Revenue]))', fmt: 'percent' },
      { name: 'Avg Unit Price', expr: 'DIVIDE(SUM([Revenue]), SUM([Units]))', fmt: 'currency' },
    ],
    report: () => [
      V('card', 3, { values: [F('Revenue')] }), V('card', 3, { values: [F('Profit')] }),
      V('card', 3, { values: [M('Profit Margin')] }), V('card', 3, { values: [F('Units')] }),
      V('line', 8, { axis: [F('Month')], values: [F('Revenue')], legend: [F('Channel')] }),
      V('donut', 4, { legend: [F('Category')], values: [F('Revenue')] }),
      V('bar', 4, { axis: [F('Region')], values: [F('Profit')] }),
      V('column', 4, { axis: [F('Category')], values: [M('Profit Margin')] }),
      V('table', 4, { columns: [F('Region')], values: [F('Revenue'), M('Profit Margin')] }),
    ],
  };
}

function makePeople() {
  const r = mulberry32(11);
  const depts = {
    Engineering: { n: 170, sal: 98000, eng: 0.25 }, Sales: { n: 120, sal: 72000, eng: -0.1 }, Marketing: { n: 60, sal: 70000, eng: 0.1 },
    Operations: { n: 90, sal: 61000, eng: -0.05 }, Finance: { n: 45, sal: 83000, eng: 0.15 }, Support: { n: 115, sal: 52000, eng: -0.6 },
  };
  const locs = { Berlin: 0.92, London: 1.05, 'New York': 1.22, Singapore: 1.0 };
  const levels = [['Junior', 0.75, 0.32], ['Mid', 1, 0.36], ['Senior', 1.32, 0.23], ['Lead', 1.65, 0.09]];
  const pick = (w) => { let x = r(), acc = 0; for (const it of w) { acc += it[2]; if (x < acc) return it; } return w[w.length - 1]; };
  const locNames = Object.keys(locs);
  const rows = [];
  for (const [d, dv] of Object.entries(depts)) for (let i = 0; i < dv.n; i++) {
    const loc = locNames[Math.floor(r() ** 1.3 * locNames.length)];
    const [lvl, lm] = pick(levels);
    const hire = 2016 + Math.min(9, Math.floor(r() ** 0.6 * 10));
    const tenure = Math.max(0.2, 2025.7 - hire - r());
    const engagement = Math.max(1, Math.min(5, 3.55 + dv.eng + (r() + r() + r() - 1.5) * 1.1 + (lvl === 'Lead' ? 0.2 : 0)));
    const leftP = 0.03 + Math.max(0, 3.5 - engagement) * 0.3 + (tenure < 1.5 ? 0.04 : 0);
    rows.push({
      Department: d, Location: loc, Level: lvl, 'Hire Year': String(hire),
      Salary: Math.round(dv.sal * lm * locs[loc] * (0.88 + r() * 0.24) / 100) * 100,
      'Tenure (yrs)': rnd(tenure, 1), Engagement: rnd(engagement, 1), Attrited: r() < leftP ? 1 : 0,
    });
  }
  return {
    id: 'people', name: 'People & Culture', short: 'People', table: 'Employees', rows,
    fields: [
      { name: 'Department', type: 'dim' }, { name: 'Location', type: 'dim' },
      { name: 'Level', type: 'dim', order: ['Junior', 'Mid', 'Senior', 'Lead'] }, { name: 'Hire Year', type: 'time' },
      { name: 'Salary', type: 'num', fmt: 'currency' }, { name: 'Tenure (yrs)', type: 'num' },
      { name: 'Engagement', type: 'num' }, { name: 'Attrited', type: 'num' },
    ],
    measures: [
      { name: 'Headcount', expr: 'COUNTROWS(Employees)', fmt: 'number' },
      { name: 'Avg Salary', expr: 'AVERAGE([Salary])', fmt: 'currency' },
      { name: 'Attrition Rate', expr: 'AVERAGE([Attrited])', fmt: 'percent' },
      { name: 'Avg Engagement', expr: 'AVERAGE([Engagement])', fmt: 'number' },
    ],
    report: () => [
      V('card', 3, { values: [M('Headcount')] }), V('card', 3, { values: [M('Avg Salary')] }),
      V('card', 3, { values: [M('Attrition Rate')] }), V('card', 3, { values: [M('Avg Engagement')] }),
      V('column', 8, { axis: [F('Hire Year')], values: [M('Headcount')] }),
      V('donut', 4, { legend: [F('Location')], values: [M('Headcount')] }),
      V('bar', 4, { axis: [F('Department')], values: [M('Attrition Rate')] }),
      V('column', 4, { axis: [F('Level')], values: [M('Avg Salary')] }),
      V('table', 4, { columns: [F('Department')], values: [M('Headcount'), M('Avg Engagement')] }),
    ],
  };
}

function makeWeb() {
  const r = mulberry32(23);
  const sources = { Organic: [42000, 0.021, 84], Paid: [26000, 0.032, 71], Social: [18000, 0.009, 58], Email: [9000, 0.045, 92], Referral: [7000, 0.028, 88] };
  const devices = { Desktop: [0.47, 1.3], Mobile: [0.45, 0.68], Tablet: [0.08, 0.95] };
  const countries = { 'United States': [0.34, 1.15], 'United Kingdom': [0.14, 1.05], Germany: [0.13, 1.0], India: [0.17, 0.55], Brazil: [0.1, 0.7], Japan: [0.12, 0.95] };
  const rows = [];
  monthList('2025-01', 12).forEach((mo, i) => {
    const season = 1 + (i >= 10 ? 0.35 : 0) + 0.05 * Math.sin(i);
    for (const [src, [s, cr, aov]] of Object.entries(sources))
      for (const [dev, [ds, dcr]] of Object.entries(devices))
        for (const [ctry, [cs, ccr]] of Object.entries(countries)) {
          const shift = dev === 'Mobile' ? 1 + i * 0.04 : dev === 'Desktop' ? 1 - i * 0.02 : 1;   // mobile takes over
          const sessions = Math.round(s * ds * shift * cs * season * (0.85 + r() * 0.3));
          const conv = Math.round(sessions * cr * dcr * ccr * (0.8 + r() * 0.4));
          rows.push({ Month: mo, Source: src, Device: dev, Country: ctry, Sessions: sessions, Conversions: conv, Revenue: rnd(conv * aov * (0.85 + r() * 0.3), 2) });
        }
  });
  return {
    id: 'web', name: 'Web Analytics', short: 'Web', table: 'Traffic', rows,
    fields: [
      { name: 'Month', type: 'time' }, { name: 'Source', type: 'dim' },
      { name: 'Device', type: 'dim', order: ['Desktop', 'Mobile', 'Tablet'] }, { name: 'Country', type: 'dim' },
      { name: 'Sessions', type: 'num' }, { name: 'Conversions', type: 'num' }, { name: 'Revenue', type: 'num', fmt: 'currency' },
    ],
    measures: [
      { name: 'Conversion Rate', expr: 'DIVIDE(SUM([Conversions]), SUM([Sessions]))', fmt: 'percent' },
      { name: 'Revenue per Session', expr: 'DIVIDE(SUM([Revenue]), SUM([Sessions]))', fmt: 'currency' },
    ],
    report: () => [
      V('card', 3, { values: [F('Sessions')] }), V('card', 3, { values: [F('Conversions')] }),
      V('card', 3, { values: [M('Conversion Rate')] }), V('card', 3, { values: [F('Revenue')] }),
      V('line', 8, { axis: [F('Month')], values: [F('Sessions')], legend: [F('Device')] }),
      V('donut', 4, { legend: [F('Device')], values: [F('Sessions')] }),
      V('bar', 4, { axis: [F('Source')], values: [F('Conversions')] }),
      V('column', 4, { axis: [F('Country')], values: [M('Conversion Rate')] }),
      V('table', 4, { columns: [F('Source')], values: [F('Sessions'), M('Conversion Rate')] }),
    ],
  };
}

// =====================================================================
// Aggregation + DAX-lite measures
// =====================================================================
function aggFn(agg, k) {
  switch (agg) {
    case 'sum': return rows => { let s = 0; for (const r of rows) s += r[k]; return s; };
    case 'avg': return rows => { if (!rows.length) return null; let s = 0; for (const r of rows) s += r[k]; return s / rows.length; };
    case 'min': return rows => rows.length ? rows.reduce((m, r) => Math.min(m, r[k]), Infinity) : null;
    case 'max': return rows => rows.length ? rows.reduce((m, r) => Math.max(m, r[k]), -Infinity) : null;
    case 'count': return rows => rows.length;
    case 'dcount': return rows => new Set(rows.map(r => r[k])).size;

}
const allMeasures = () => [...DS().measures, ...rep().measures];
const compiled = new Map();

// Recursive-descent parser. No eval: expressions compile to closures over rows.
function compileExpr(expr, stack = []) {
  const ds = DS(), toks = [];

    else if (m[3] !== undefined) toks.push({ t: 'ref', v: m[3].trim() });
    else if (m[4]) toks.push({ t: 'op', v: m[4] });

  const peek = () => toks[i], take = () => toks[i++];

  const lift = (op, a, b) => {
    const f = { '+': (x, y) => x + y, '-': (x, y) => x - y, '*': (x, y) => x * y, '/': (x, y) => y === 0 ? null : x / y }[op];
    return { fn: rows => { const x = a.fn(rows), y = b.fn(rows); return x == null || y == null ? null : f(x, y); }, additive: (op === '+' || op === '-') && a.additive && b.additive };
  };
  function expr_() { let a = term(); while (peek() && (peek().v === '+' || peek().v === '-')) { const op = take().v; a = lift(op, a, term()); } return a; }
  function term() { let a = unary(); while (peek() && (peek().v === '*' || peek().v === '/')) { const op = take().v; a = lift(op, a, unary()); } return a; }

    if (peek() && peek().v === '-') { take(); const a = unary(); return { fn: rows => { const x = a.fn(rows); return x == null ? null : -x; }, additive: a.additive }; }

      const mm = allMeasures().find(x => x.name.toLowerCase() === t.v.toLowerCase());

      if (['sum', 'avg', 'min', 'max'].includes(AG[t.v]) && f.type !== 'num') throw new Error(`${t.v} needs a numeric column; [${f.name}] is text`);

}

function measureOf(item) {

    try {
      if (!compiled.has(key)) compiled.set(key, compileExpr(m.expr, [m.name]));
      const c = compiled.get(key);
      return { label: m.name, fmt: m.fmt || 'number', fn: c.fn, additive: c.additive };
    } catch (e) { return { label: m.name, fmt: 'number', fn: () => null, additive: false, error: `[${m.name}]: ${e.message}` }; }

    let vals = distinct(field);
    if (vals.length > 8) {
      const counts = new Map(); for (const r of ds.rows) counts.set(r[field], (counts.get(r[field]) || 0) + 1);

}

function filteredRows(excludeSource) {
  const active = rep().filters.filter(f => f.values.length && !(excludeSource && f.source === excludeSource)).map(f => [f.field, new Set(f.values)]);
  if (!active.length) return DS().rows;
  return DS().rows.filter(r => active.every(([k, s]) => s.has(r[k])));
}
function ownHighlight(v, field) {
  const f = rep().filters.find(x => x.source === v.id && x.field === field);
  return f ? new Set(f.values) : null;
}

// Chart data: categories x series. Folds long tails into "Other", computed from
// the union of the folded rows so ratios stay correct.
function chartData(v, { byValue = false, maxCats = Infinity } = {}) {
  const W = v.wells;
  const axisItem = v.type === 'donut' ? W.legend[0] : W.axis[0];
  const legendItem = v.type === 'donut' || v.type === 'bar' ? null : W.legend[0];
  const valItem = W.values[0];
  if (!axisItem || !valItem) return null;
  const meas = measureOf(valItem);
  if (meas.error) return { error: meas.error };
  const rows = filteredRows(v.id);
  const af = axisItem.field, lf = legendItem && legendItem.field;

  let keep = null;
  if (lf) {
    const vals = [...new Set(rows.map(r => r[lf]))];
    if (vals.length > 8) {
      const counts = new Map(); for (const r of rows) counts.set(r[lf], (counts.get(r[lf]) || 0) + 1);
      keep = new Set(vals.sort((a, b) => counts.get(b) - counts.get(a)).slice(0, 7));
    }
  }
  const groups = new Map();
  for (const r of rows) {
    const c = r[af], s = lf ? (keep && !keep.has(r[lf]) ? OTHER : r[lf]) : '';
    let g = groups.get(c); if (!g) groups.set(c, g = new Map());
    let a = g.get(s); if (!a) g.set(s, a = []);
    a.push(r);
  }
  let cats = sortCats(af, [...groups.keys()]);
  let seriesKeys = lf ? sortCats(lf, [...new Set([...groups.values()].flatMap(g => [...g.keys()]).filter(k => k !== OTHER))]) : [''];
  if (lf && keep) seriesKeys.push(OTHER);

  if (byValue && !lf) {
    const val = new Map(cats.map(c => [c, meas.fn(groups.get(c).get(''))]));
    cats.sort((a, b) => (val.get(b) ?? -Infinity) - (val.get(a) ?? -Infinity));
    if (cats.length > maxCats) {
      const tail = cats.slice(maxCats - 1);
      groups.set(OTHER, new Map([['', tail.flatMap(c => groups.get(c).get(''))]]));
      cats = [...cats.slice(0, maxCats - 1), OTHER];
    }
  }
  const series = seriesKeys.map(s => ({
    key: s, label: lf ? fmtCat(lf, s) : meas.label,
    color: lf ? colorOf(lf, s) : null,
    values: cats.map(c => { const a = groups.get(c) && groups.get(c).get(s); return a ? meas.fn(a) : null; }),
  }));
  return { cats, series, meas, af, lf, highlight: ownHighlight(v, af), rowCount: rows.length };
}

function tableData(v) {
  const dims = v.wells.columns.map(i => i.field);
  const ms = v.wells.values.map(measureOf);
  const err = ms.find(m => m.error);
  if (err) return { error: err.error };
  const rows = filteredRows(v.id);
  const groups = new Map();
  for (const r of rows) {
    const key = dims.map(f => r[f]).join('\u0001');
    let a = groups.get(key); if (!a) groups.set(key, a = []);
    a.push(r);
  }
  const out = dims.length ? [...groups.values()].map(rs => ({ keys: dims.map(f => rs[0][f]), vals: ms.map(m => m.fn(rs)) })) : [];
  const sort = v.sort || (ms.length ? { col: dims.length, dir: -1 } : { col: 0, dir: 1 });
  out.sort((a, b) => {
    const x = sort.col < dims.length ? a.keys[sort.col] : a.vals[sort.col - dims.length];
    const y = sort.col < dims.length ? b.keys[sort.col] : b.vals[sort.col - dims.length];
    if (typeof x === 'number' || typeof y === 'number') return ((x ?? -Infinity) - (y ?? -Infinity)) * sort.dir;
    return String(x).localeCompare(String(y), 'en', { numeric: true }) * sort.dir;
  });
  return { dims, ms, out, total: ms.map(m => m.fn(rows)), sort, highlight: dims.length ? ownHighlight(v, dims[0]) : null };
}

// =====================================================================
// SVG chart helpers
// =====================================================================
function niceTicks(lo, hi, n = 4) {
  const span = hi - lo || 1, raw = span / n, mag = 10 ** Math.floor(Math.log10(raw)), e = raw / mag;
  const step = (e >= 7.5 ? 10 : e >= 3.5 ? 5 : e >= 1.5 ? 2 : 1) * mag;
  const t = []; for (let x = Math.floor(lo / step) * step; x <= Math.ceil(hi / step) * step + step / 2; x += step) t.push(+x.toFixed(12));
  return t;
}
function valueAxis(vals, a0, a1, fmt) {       // maps value -> pixel between a0 (value lo) and a1 (value hi)
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  if (!vals.length || hi === lo) hi = lo + 1;
  const ticks = niceTicks(lo, hi); lo = ticks[0]; hi = ticks[ticks.length - 1];
  const px = v => a0 + (v - lo) / (hi - lo) * (a1 - a0);
  const labels = ticks.map(t => fmtVal(t, fmt));
  return { px, ticks, labels, width: Math.max(...labels.map(l => l.length)) * 6.4 + 10 };
}
function vbar(x, yb, ye, w, r) {           // rounded data-end, square at the baseline
  const h = Math.abs(yb - ye); if (h < 0.5 || w <= 0) return '';
  r = Math.min(r, w / 2, h);
  const s = ye < yb ? 1 : -1;
  return `M${x},${yb}V${ye + s * r}Q${x},${ye} ${x + r},${ye}H${x + w - r}Q${x + w},${ye} ${x + w},${ye + s * r}V${yb}Z`;
}
function hbar(xb, xe, y, h, r) {
  const w = Math.abs(xe - xb); if (w < 0.5 || h <= 0) return '';
  r = Math.min(r, h / 2, w);
  const s = xe > xb ? 1 : -1;
  return `M${xb},${y}H${xe - s * r}Q${xe},${y} ${xe},${y + r}V${y + h - r}Q${xe},${y + h} ${xe - s * r},${y + h}H${xb}Z`;
}
function tipHtml(title, entries, kind = 'bar') {
  return `<div class="tt-h">${esc(title)}</div>` + entries.map(e =>
    `<div class="tt-r"><span class="sw line" style="background:${e.color || 'var(--s1)'}"></span><span class="tt-v">${esc(e.value)}</span><span class="tt-l">${esc(e.label)}</span></div>`).join('');
}
function catTip(d, i) {
  return tipHtml(fmtCat(d.af, d.cats[i]), d.series.filter(s => s.values[i] != null).map(s => ({ color: s.color || 'var(--s1)', label: s.label, value: fmtVal(s.values[i], d.meas.fmt, 'full') })));
}
function legendHtml(d, kind) {
  if (d.series.length < 2) return '';
  return `<div class="legend">${d.series.map(s => `<span><i class="sw${kind === 'line' ? ' line' : ''}" style="background:${s.color}"></i>${esc(s.label)}</span>`).join('')}</div>`;
}
const svgOpen = (W, H, label) => `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">`;
const xLabelEvery = (labels, band) => Math.max(1, Math.ceil((Math.max(...labels.map(l => Math.min(l.length, 12))) * 6.4 + 10) / band));

function renderColumn(v, d, W, title) {
  const H = 240, mt = 16, mb = 26, mr = 6;
  const vals = d.series.flatMap(s => s.values).filter(x => x != null);
  const ax = valueAxis(vals, H - mb, mt, d.meas.fmt), ml = ax.width;
  const n = d.cats.length, k = d.series.length, band = (W - ml - mr) / n;
  const inner = band * (n > 16 ? 0.86 : 0.7), bw = Math.max(1, (inner - 2 * (k - 1)) / k), y0 = ax.px(0);
  let grid = '', hits = '', bars = '', labels = '';
  ax.ticks.forEach((t, i) => { grid += `<line class="gl" x1="${ml}" x2="${W - mr}" y1="${ax.px(t)}" y2="${ax.px(t)}"/><text class="tk" x="${ml - 6}" y="${ax.px(t) + 4}" text-anchor="end">${esc(ax.labels[i])}</text>`; });
  d.cats.forEach((c, i) => {
    const bx = ml + i * band, dim = d.highlight && !d.highlight.has(c) ? ' dim' : '';
    hits += `<rect class="hit" x="${bx}" y="${mt}" width="${band}" height="${H - mt - mb}" data-f="${esc(d.af)}" data-x="${esc(c)}" data-tip="${esc(catTip(d, i))}"/>`;
    d.series.forEach((s, j) => {
      const val = s.values[i]; if (val == null) return;
      bars += `<path class="mark${dim}" d="${vbar(bx + (band - inner) / 2 + j * (bw + 2), y0, ax.px(val), bw, 4)}" fill="${s.color || (c === OTHER ? 'var(--other)' : 'var(--s1)')}"/>`;
    });
  });
  const labs = d.cats.map(c => fmtCat(d.af, c)), isTime = DS().fieldMap[d.af].type === 'time';
  const every = isTime ? xLabelEvery(labs, band) : 1, fit = isTime ? 12 : Math.max(3, Math.floor((band - 4) / 6.4));
  labs.forEach((l, i) => { if (i % every === 0) labels += `<text class="tk" x="${ml + i * band + band / 2}" y="${H - mb + 16}" text-anchor="middle">${esc(trunc(l, fit))}</text>`; });
  if (k === 1) {        // selective direct label: the peak only
    let mi = -1, mv = -Infinity; d.series[0].values.forEach((x, i) => { if (x != null && x > mv) { mv = x; mi = i; } });
    if (mi >= 0 && mv > 0) labels += `<text class="dl" x="${ml + mi * band + band / 2}" y="${ax.px(mv) - 5}" text-anchor="middle">${esc(fmtVal(mv, d.meas.fmt))}</text>`;
  }
  return legendHtml(d, 'bar') + svgOpen(W, H, title) + grid + hits + bars + `<line class="bl" x1="${ml}" x2="${W - mr}" y1="${y0}" y2="${y0}"/>` + labels + '</svg>';
}

function renderBar(v, d, W, title) {
  const rowH = 26, mt = 4, mb = 22, n = d.cats.length, H = n * rowH + mt + mb;
  const labs = d.cats.map(c => fmtCat(d.af, c));
  const lw = Math.min(Math.max(W * 0.34, 60), Math.max(...labs.map(l => l.length)) * 6.8 + 12), mr = 46;
  const vals = d.series[0].values.filter(x => x != null);
  const ax = valueAxis(vals, lw, W - mr, d.meas.fmt), x0 = ax.px(0);
  let s = svgOpen(W, H, title);
  ax.ticks.forEach((t, i) => { s += `<line class="gl" x1="${ax.px(t)}" x2="${ax.px(t)}" y1="${mt}" y2="${H - mb}"/><text class="tk" x="${ax.px(t)}" y="${H - 6}" text-anchor="middle">${esc(ax.labels[i])}</text>`; });
  d.cats.forEach((c, i) => {
    const y = mt + i * rowH, val = d.series[0].values[i], dim = d.highlight && !d.highlight.has(c) ? ' dim' : '';
    s += `<rect class="hit" x="0" y="${y}" width="${W}" height="${rowH}" data-f="${esc(d.af)}" data-x="${esc(c)}" data-tip="${esc(catTip(d, i))}"/>`;
    s += `<text class="cl${dim}" x="${lw - 8}" y="${y + rowH / 2 + 4}" text-anchor="end" style="pointer-events:none">${esc(trunc(labs[i], Math.floor((lw - 12) / 6.8)))}</text>`;
    if (val != null) s += `<path class="mark${dim}" d="${hbar(x0, ax.px(val), y + 4, rowH - 8, 4)}" fill="${c === OTHER ? 'var(--other)' : 'var(--s1)'}"/>`;
    if (i === 0 && val != null) s += `<text class="dl" x="${ax.px(val) + (val >= 0 ? 6 : -6)}" y="${y + rowH / 2 + 4}" text-anchor="${val >= 0 ? 'start' : 'end'}">${esc(fmtVal(val, d.meas.fmt))}</text>`;
  });
  return s + `<line class="bl" x1="${x0}" x2="${x0}" y1="${mt}" y2="${H - mb}"/></svg>`;
}

const lineMeta = new Map();
function renderLine(v, d, W, title) {
  const H = 240, mt = 12, mb = 26, k = d.series.length, direct = k >= 2 && k <= 4;
  const mr = direct ? Math.min(96, Math.max(...d.series.map(s => trunc(s.label, 12).length)) * 6.6 + 18) : 10;
  const vals = d.series.flatMap(s => s.values).filter(x => x != null);
  const ax = valueAxis(vals, H - mb, mt, d.meas.fmt), ml = ax.width;
  const n = d.cats.length, pw = W - ml - mr;
  const xs = d.cats.map((_, i) => ml + (n === 1 ? pw / 2 : i * pw / (n - 1)));
  const step = n > 1 ? pw / (n - 1) : pw;
  let s = svgOpen(W, H, title);
  ax.ticks.forEach((t, i) => { s += `<line class="gl" x1="${ml}" x2="${W - mr}" y1="${ax.px(t)}" y2="${ax.px(t)}"/><text class="tk" x="${ml - 6}" y="${ax.px(t) + 4}" text-anchor="end">${esc(ax.labels[i])}</text>`; });
  if (d.highlight) d.cats.forEach((c, i) => { if (d.highlight.has(c)) s += `<rect class="hl-band" x="${xs[i] - step / 2}" y="${mt}" width="${step}" height="${H - mt - mb}"/>`; });
  const labs = d.cats.map(c => fmtCat(d.af, c)), every = xLabelEvery(labs, step);
  labs.forEach((l, i) => { if (i % every === 0) s += `<text class="tk" x="${xs[i]}" y="${H - mb + 16}" text-anchor="middle">${esc(trunc(l, 12))}</text>`; });
  const ends = [];
  d.series.forEach(se => {
    const color = se.color || 'var(--s1)';
    let p = '', pen = false;
    se.values.forEach((val, i) => { if (val == null) { pen = false; return; } p += `${pen ? 'L' : 'M'}${xs[i].toFixed(1)},${ax.px(val).toFixed(1)}`; pen = true; });
    s += `<path class="ln" d="${p}" stroke="${color}"/>`;
    const li = se.values.map((x, i) => x == null ? -1 : i).filter(i => i >= 0).pop();
    if (li != null) ends.push({ x: xs[li], y: ax.px(se.values[li]), label: se.label, color });
  });
  if (direct) {
    ends.sort((a, b) => a.y - b.y).forEach((e, i, arr) => { e.ly = i && e.y - arr[i - 1].ly < 13 ? arr[i - 1].ly + 13 : e.y; });
    ends.forEach(e => { s += `<circle cx="${e.x}" cy="${e.y}" r="4" fill="${e.color}" stroke="var(--surface)" stroke-width="2"/><text class="cl" x="${e.x + 9}" y="${e.ly + 4}" style="font-size:11px">${esc(trunc(e.label, 12))}</text>`; });
  }
  s += `<line class="bl" x1="${ml}" x2="${W - mr}" y1="${ax.px(0)}" y2="${ax.px(0)}"/>`;
  s += `<g class="hov"></g><rect class="lineov" x="${ml - step / 2}" y="${mt}" width="${pw + step}" height="${H - mt - mb}" data-vid="${v.id}" data-f="${esc(d.af)}"/>`;
  lineMeta.set(v.id, { xs, d, ax, mt, mb, H });
  return legendHtml(d, 'line') + s + '</svg>';
}

function renderDonut(v, d, W, title) {
  if (!d.meas.additive) return `<div class="note">A donut shows parts of a whole, so it needs a value that adds up, like a Sum or Count. <b>${esc(d.meas.label)}</b> is a ratio or an average. Try a column or bar chart instead.</div>`;
  const vals = d.series[0].values;
  if (vals.some(x => x != null && x < 0)) return `<div class="note">This value has negative parts, so it can’t be drawn as slices. Try a bar chart.</div>`;
  const total = vals.reduce((a, x) => a + (x || 0), 0);
  if (!total) return `<div class="empty">No data for the current filters.</div>`;
  const stack = W < 400, size = stack ? Math.min(180, W - 10) : Math.min(170, W * 0.45);
  const R = size / 2 - 2, r = R * 0.62, c = size / 2;
  let a = -Math.PI / 2, arcs = '';
  const pt = (rad, ang) => `${(c + rad * Math.cos(ang)).toFixed(2)},${(c + rad * Math.sin(ang)).toFixed(2)}`;
  d.cats.forEach((cat, i) => {
    const val = vals[i] || 0; if (!val) return;
    let sweep = val / total * Math.PI * 2; if (sweep >= Math.PI * 2 - 1e-6) sweep = Math.PI * 2 - 1e-4;
    const b = a + sweep, lg = sweep > Math.PI ? 1 : 0, dim = d.highlight && !d.highlight.has(cat) ? ' dim' : '';
    arcs += `<path class="seg${dim}" d="M${pt(R, a)}A${R},${R} 0 ${lg} 1 ${pt(R, b)}L${pt(r, b)}A${r},${r} 0 ${lg} 0 ${pt(r, a)}Z" fill="${colorOf(d.af, cat)}" stroke="var(--surface)" stroke-width="2" data-f="${esc(d.af)}" data-x="${esc(cat)}" data-tip="${esc(tipHtml(fmtCat(d.af, cat), [{ color: colorOf(d.af, cat), label: `${rnd(val / total * 100, 1)}% of total`, value: fmtVal(val, d.meas.fmt, 'full') }]))}"/>`;
    a = b;
  });
  const center = `<text x="${c}" y="${c + 2}" text-anchor="middle" style="fill:var(--ink);font-size:${Math.max(14, r * 0.34)}px;font-weight:650">${esc(fmtVal(total, d.meas.fmt))}</text><text x="${c}" y="${c + 18}" text-anchor="middle" class="tk">Total</text>`;
  const list = d.cats.map((cat, i) => `<div data-f="${esc(d.af)}" data-x="${esc(cat)}" class="${d.highlight && !d.highlight.has(cat) ? 'dim' : ''}"><i class="sw" style="background:${colorOf(d.af, cat)}"></i><span class="nm">${esc(fmtCat(d.af, cat))}</span><span class="pc">${rnd((vals[i] || 0) / total * 100, 1)}%</span><span class="vl">${esc(fmtVal(vals[i], d.meas.fmt))}</span></div>`).join('');
  return `<div class="donut-wrap${stack ? ' stack' : ''}">${svgOpen(size, size, title)}${arcs}${center}</svg><div class="dlist">${list}</div></div>`;
}

function renderCard(v) {
  const it = v.wells.values[0];
  const m = measureOf(it);
  if (m.error) return `<div class="note">${esc(m.error)}</div>`;
  const val = m.fn(filteredRows(v.id));
  return `<div class="kpi"><div class="kpi-v" title="${esc(fmtVal(val, m.fmt, 'full'))}">${esc(fmtVal(val, m.fmt))}</div><div class="kpi-l">${esc(m.label)}</div></div>`;
}

function renderTable(v, t) {
  const arrow = i => t.sort.col === i ? `<span class="arrow">${t.sort.dir > 0 ? ' ↑' : ' ↓'}</span>` : '';
  let h = '<div class="tablewrap"><table class="dt"><thead><tr>';
  t.dims.forEach((d, i) => { h += `<th data-act="sort" data-col="${i}">${esc(d)}${arrow(i)}</th>`; });
  t.ms.forEach((m, j) => { h += `<th class="n" data-act="sort" data-col="${t.dims.length + j}">${esc(m.label)}${arrow(t.dims.length + j)}</th>`; });
  h += '</tr></thead><tbody>';
  const shown = t.out.slice(0, 300);
  shown.forEach(row => {
    const dim = t.highlight && !t.highlight.has(row.keys[0]) ? ' class="dim"' : '';
    h += `<tr${dim} data-f="${esc(t.dims[0])}" data-x="${esc(row.keys[0])}">` + row.keys.map((k, i) => `<td>${esc(fmtCat(t.dims[i], k))}</td>`).join('') + row.vals.map((x, j) => `<td class="n">${esc(fmtVal(x, t.ms[j].fmt, 'full'))}</td>`).join('') + '</tr>';
  });
  h += '</tbody>';
  if (t.ms.length) h += `<tfoot><tr>${t.dims.length ? `<td colspan="${t.dims.length}">Total</td>` : ''}${t.total.map((x, j) => `<td class="n">${esc(fmtVal(x, t.ms[j].fmt, 'full'))}</td>`).join('')}</tr></tfoot>`;
  h += '</table></div>';
  if (t.out.length > shown.length) h += `<div class="hint">Showing the first ${shown.length} of ${t.out.length} rows.</div>`;
  return h;
}
function chartAsTable(d) {
  return renderTable({}, {
    dims: [d.af], ms: d.series.map(s => ({ label: d.lf ? s.label : d.meas.label, fmt: d.meas.fmt })),
    out: d.cats.map((c, i) => ({ keys: [c], vals: d.series.map(s => s.values[i]) })),
    total: [], sort: { col: -1, dir: 1 }, highlight: d.highlight,
  }).replace(/data-act="sort"/g, '');
}

// =====================================================================
// Rendering the report
// =====================================================================
function autoTitle(v) {
  const W = v.wells, vals = W.values.map(itemLabel), dims = [...W.axis, ...W.legend, ...W.columns].map(i => i.field);
  if (v.type === 'card') return vals[0] || 'Card';
  if (!vals.length && !dims.length) return TYPES[v.type].label;
  return vals.length ? `${vals.join(', ')}${dims.length ? ' by ' + dims.join(v.type === 'table' ? ', ' : ' and ') : ''}` : dims.join(', ');
}
const emptyVisual = type => `<div class="empty"><div>${ICON[type]}<br>Choose fields from the <b>Data</b> pane${window.innerWidth > 820 ? ', or drag them onto this visual’s wells' : ''}.</div></div>`;

function visualBody(v, W) {
  const title = v.title || autoTitle(v);
  if (v.type === 'card') return v.wells.values[0] ? renderCard(v) : emptyVisual('card');
  if (v.type === 'table') {
    if (!v.wells.columns.length && !v.wells.values.length) return emptyVisual('table');
    const t = tableData(v); if (t.error) return `<div class="note">${esc(t.error)}</div>`;
    if (!t.dims.length) t.out = [];
    return renderTable(v, t);
  }
  const d = chartData(v, { byValue: v.type === 'bar' || v.type === 'donut', maxCats: v.type === 'bar' ? 10 : v.type === 'donut' ? 6 : Infinity });
  if (!d) return emptyVisual(v.type);
  if (d.error) return `<div class="note">${esc(d.error)}</div>`;
  if (!d.cats.length) return '<div class="empty">No data for the current filters.</div>';
  if (v.asTable) return chartAsTable(d);
  if (v.type === 'column') return renderColumn(v, d, W, title);
  if (v.type === 'bar') return renderBar(v, d, W, title);
  if (v.type === 'line') return renderLine(v, d, W, title);
  if (v.type === 'donut') return renderDonut(v, d, W, title);
}

const canvas = $('#canvas');
function renderCanvas() {
  const r = rep();
  lineMeta.clear();
  if (!r.visuals.length) {
    canvas.innerHTML = `<div class="visual" data-span="12"><div class="empty"><div>This report is empty.<br><button class="btn primary" style="margin-top:10px" data-new="1">＋ Add a visual</button></div></div></div>`;
    return;
  }
  // First pass lays out the shells so each body can be sized to its real width.
  canvas.innerHTML = r.visuals.map(v => {
    const chart = v.type !== 'card' && v.type !== 'table';
    const acts = (chart ? `<button class="icon-btn${v.asTable ? ' on' : ''}" data-act="table" title="${v.asTable ? 'Show as chart' : 'Show as table'}" aria-label="${v.asTable ? 'Show as chart' : 'Show as table'}" aria-pressed="${!!v.asTable}">${ICON.asTable}</button>` : '')
      + (v.type !== 'card' ? `<button class="icon-btn" data-act="csv" title="Export data (CSV)" aria-label="Export data as CSV">${ICON.csv}</button>` : '')
      + `<button class="icon-btn" data-act="del" title="Remove visual" aria-label="Remove visual">${ICON.del}</button>`;
    return `<article class="visual${state.sel === v.id ? ' sel' : ''}" data-vid="${v.id}" data-span="${v.span}" data-type="${v.type}" tabindex="-1">
      <header class="vh"><h3 class="vt">${v.type === 'card' ? '' : esc(v.title || autoTitle(v))}</h3><div class="vacts">${acts}</div></header>
      <div class="vb"></div></article>`;
  }).join('');
  for (const el of canvas.querySelectorAll('.visual[data-vid]')) {
    const v = findV(el.dataset.vid), body = el.querySelector('.vb');
    try { body.innerHTML = visualBody(v, Math.max(120, Math.floor(body.clientWidth))); }
    catch (e) { body.innerHTML = `<div class="note">Couldn’t draw this visual: ${esc(e.message)}</div>`; }
  }
}

function renderHead() {
  const ds = DS(), rows = filteredRows(null).length;
  $('#reportTitle').textContent = ds.name;
  $('#reportMeta').textContent = `${rows.toLocaleString('en-US')} of ${ds.rows.length.toLocaleString('en-US')} rows · click any bar, slice or row to cross-filter`;
  $('#dsTabs').innerHTML = DATASETS.map(d => `<button role="tab" aria-selected="${d.id === ds.id}" data-ds="${d.id}">${esc(d.short)}</button>`).join('');
  document.body.classList.toggle('reading', !state.edit);
  $('#modeBtn').innerHTML = state.edit ? '<span aria-hidden="true">◉</span><span class="txt">Reading view</span>' : '<span aria-hidden="true">✎</span><span class="txt">Edit</span>';

  if (state.theme) document.documentElement.dataset.theme = state.theme; else delete document.documentElement.dataset.theme;
}

function renderFilterbar() {
  const r = rep();

  for (const f of r.filters) {
    const src = f.source && findV(f.source);

}

// ---------------------------------------------------------------- panes
function renderPanes() {
  const ds = DS(), v = state.sel && findV(state.sel);
  let h = `<h2>Visualizations</h2><div class="types">${Object.entries(TYPES).map(([k, t]) =>
    `<button class="${v && v.type === k ? 'on' : ''}" data-type="${k}" title="${t.label}" aria-label="${v ? 'Change to' : 'Add'} ${t.label}">${ICON[k]}</button>`).join('')}</div>`;

      items.forEach((it, idx) => {

            agg = `<select data-agg="${w.key}:${idx}" aria-label="Aggregation">${opts.map(o => `<option value="${o}"${o === cur ? ' selected' : ''}>${AGGS[o]}</option>`).join('')}</select>`;
          }
        }
        h += `<div class="wchip"><span class="nm" title="${esc(it.kind === 'measure' ? it.name : it.field)}">${it.kind === 'measure' ? 'ƒx ' : ''}${esc(it.kind === 'measure' ? it.name : it.field)}</span>${agg}<button class="icon-btn" data-rmw="${w.key}:${idx}" aria-label="Remove">${ICON.del}</button></div>`;
      });
      h += `</div></div>`;
    }
    h += `<h2 style="margin-top:16px">Format</h2>
      <div class="frow"><label for="vtitle">Title</label><input id="vtitle" value="${esc(v.title || '')}" placeholder="${esc(autoTitle(v))}"></div>
      <div class="frow"><label>Width</label><div class="seg-ctl">${[[3, '¼'], [4, '⅓'], [6, '½'], [8, '⅔'], [12, 'Full']].map(([n, l]) => `<button class="${v.span === n ? 'on' : ''}" data-span="${n}">${l}</button>`).join('')}</div></div>
      <div class="frow"><label>Order</label><div class="seg-ctl"><button data-move="-1">← Earlier</button><button data-move="1">Later →</button></div></div>
      <div class="frow"><button class="btn warn" data-delv="1" style="flex:1;justify-content:center">Remove visual</button></div>`;
  }
  $('#vizPane').innerHTML = h;

  // fields pane
  const used = v ? [...v.wells.axis, ...v.wells.values, ...v.wells.legend, ...v.wells.columns] : [];
  const isUsed = ref => used.some(it => sameRef(it, ref));
  const row = (ref, icon, name, extra = '', title = '') =>
    `<div class="field${isUsed(ref) ? ' used' : ''}" draggable="true" tabindex="0" role="button" data-ref="${esc(JSON.stringify(ref))}" title="${esc(title || name)}"><span class="ck" aria-hidden="true">${isUsed(ref) ? '✓' : ''}</span><span class="fi" aria-hidden="true">${icon}</span><span class="nm">${esc(name)}</span>${extra}</div>`;
  let f = `<h2>Data<span class="spacer"></span><button class="linkish" data-mnew="1">＋ New measure</button></h2>`;
  if (state.mform) f += measureForm();
  f += `<div class="tbl-name">${ICON.table} ${esc(ds.table)}</div>`;
  for (const m of ds.measures) f += row({ kind: 'measure', name: m.name }, 'ƒx', m.name, '', `${m.name} = ${m.expr}`);
  rep().measures.forEach((m, i) => {
    f += row({ kind: 'measure', name: m.name }, 'ƒx', m.name, `<span class="ops"><button class="icon-btn" data-medit="${i}" aria-label="Edit measure" title="Edit">✎</button><button class="icon-btn" data-mdel="${i}" aria-label="Delete measure" title="Delete">${ICON.del}</button></span>`, `${m.name} = ${m.expr}`);
  });
  for (const fd of ds.fields) f += row({ kind: 'field', field: fd.name }, fd.type === 'num' ? 'Σ' : fd.type === 'time' ? '◷' : 'Aa', fd.name);
  f += `<p class="hint">${window.innerWidth > 820 ? 'Click a field to add it to the selected visual, or drag it onto a well.' : 'Tap a field to add it to the selected visual.'}</p>`;
  $('#fieldsPane').innerHTML = f;
}

function measureForm() {
  const m = state.mform;
  return `<form class="mform" id="mform" autocomplete="off">
    <input name="mname" placeholder="Measure name" value="${esc(m.name)}" aria-label="Measure name" required>
    <textarea name="mexpr" spellcheck="false" aria-label="Expression" placeholder="DIVIDE(SUM([Profit]), SUM([Revenue]))">${esc(m.expr)}</textarea>
    <div class="row"><select name="mfmt" aria-label="Format">${['number', 'currency', 'percent'].map(o => `<option${o === m.fmt ? ' selected' : ''}>${o}</option>`).join('')}</select></div>
    <div class="msg" id="mmsg"></div>
    <div class="row"><button class="btn primary" type="submit">Save</button><button class="btn" type="button" data-mcancel="1">Cancel</button></div>
    <div class="mhelp"><code>SUM</code> <code>AVERAGE</code> <code>MIN</code> <code>MAX</code> <code>COUNT</code> <code>DISTINCTCOUNT</code> take a column like <code>[Revenue]</code>. Also <code>COUNTROWS()</code>, <code>DIVIDE(a, b)</code>, <code>+ − × ÷</code>, and other measures as <code>[Name]</code>.</div>
  </form>`;
}
function checkMeasure() {
  const form = $('#mform'); if (!form) return null;
  const el = form.elements, name = el.mname.value.trim(), expr = el.mexpr.value, fmt = el.mfmt.value, msg = $('#mmsg');
  Object.assign(state.mform, { name, expr, fmt });
  if (!expr.trim()) { msg.className = 'msg'; msg.textContent = ''; return null; }
  try {
    const c = compileExpr(expr, [name]);
    msg.className = 'msg ok'; msg.textContent = `✓ Across all rows: ${fmtVal(c.fn(DS().rows), fmt, 'full')}`;
    return c;
  } catch (e) { msg.className = 'msg err'; msg.textContent = e.message; return null; }
}

function renderAll() {
  renderHead(); renderFilterbar(); renderCanvas(); renderPanes();
  if (state.mform) checkMeasure();
}
function commit() {
  const r = rep();
  // drop cross-filters whose source visual is gone or no longer shows that field
  r.filters = r.filters.filter(f => {
    if (!f.source) return true;
    const v = findV(f.source);
    return v && [...v.wells.axis, ...v.wells.legend, ...v.wells.columns].some(it => it.field === f.field);
  });
  save(); renderAll();
}

// =====================================================================
// Editing actions
// =====================================================================
function addVisual(type) {
  const v = V(type, TYPES[type].span);
  rep().visuals.push(v); state.sel = v.id; commit();
  requestAnimationFrame(() => { const el = canvas.querySelector(`[data-vid="${v.id}"]`); el && el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); });
}
function setType(v, type) {
  const dims = [...v.wells.axis, ...v.wells.legend, ...v.wells.columns].filter(it => it.kind === 'field');
  const vals = v.wells.values;
  v.wells = { axis: [], values: [], legend: [], columns: [] };
  const wells = TYPES[type].wells;
  for (const w of wells.filter(w => w.accept === 'dim')) while (dims.length && v.wells[w.key].length < w.max) v.wells[w.key].push(dims.shift());
  for (const w of wells.filter(w => w.accept === 'value')) while (vals.length && v.wells[w.key].length < w.max) v.wells[w.key].push(vals.shift());
  v.type = type; v.asTable = false; delete v.sort;
}
function refKind(ref) { return ref.kind === 'measure' || DS().fieldMap[ref.field].type === 'num' ? 'value' : 'dim'; }
function toItem(ref) { return ref.kind === 'measure' ? { kind: 'measure', name: ref.name } : { kind: 'field', field: ref.field, agg: null }; }

function addRef(ref) {
  let v = state.sel && findV(state.sel);
  const kind = refKind(ref);
  if (!v) { v = V(kind === 'dim' ? 'column' : 'card', kind === 'dim' ? 6 : 3); rep().visuals.push(v); state.sel = v.id; }
  for (const k of Object.keys(v.wells)) {      // clicking a used field removes it, like a checkbox
    const i = v.wells[k].findIndex(it => sameRef(it, ref));
    if (i >= 0) { v.wells[k].splice(i, 1); return commit(); }
  }
  const wells = TYPES[v.type].wells;
  let cands = wells.filter(w => w.accept === kind);
  if (!cands.length) cands = wells.filter(w => w.accept === 'value');     // e.g. a category on a card -> Count
  const target = cands.find(w => v.wells[w.key].length < w.max) || cands[0];
  dropInto(v, target.key, ref);
}
function dropInto(v, key, ref) {
  const w = TYPES[v.type].wells.find(x => x.key === key);
  if (!w) return;
  if (w.accept === 'dim' && refKind(ref) !== 'dim') return flash(`${TYPES[v.type].label}: “${w.label}” takes a category, not a number.`);
  for (const k of Object.keys(v.wells)) v.wells[k] = v.wells[k].filter(it => !sameRef(it, ref));
  const list = v.wells[key];
  if (list.length >= w.max) list[w.max - 1] = toItem(ref); else list.push(toItem(ref));
  commit();
}
function crossFilter(v, field, value) {
  const r = rep(), mine = r.filters.find(f => f.source === v.id);
  const same = mine && mine.field === field && mine.values.length === 1 && mine.values[0] === value;
  r.filters = r.filters.filter(f => f.source !== v.id);
  if (!same) r.filters.push({ id: uid(), field, values: [value], source: v.id });
  commit();
}
function exportCsv(v) {
  let head, body;
  if (v.type === 'table') {
    const t = tableData(v); if (t.error) return;
    head = [...t.dims, ...t.ms.map(m => m.label)]; body = t.out.map(r => [...r.keys, ...r.vals]);
  } else {
    const d = chartData(v, { byValue: v.type === 'bar' || v.type === 'donut', maxCats: v.type === 'bar' ? 10 : v.type === 'donut' ? 6 : Infinity });
    if (!d || d.error) return;
    head = [d.af, ...d.series.map(s => d.lf ? s.label : d.meas.label)]; body = d.cats.map((c, i) => [c, ...d.series.map(s => s.values[i])]);
  }
  const q = x => { const s = x == null ? '' : String(x); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const csv = [head, ...body].map(r => r.map(q).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = (v.title || autoTitle(v)).replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_').slice(0, 60) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
let flashTimer;
function flash(text) {
  const tip = $('#tip'); tip.innerHTML = `<div class="tt-h" style="margin:0">${esc(text)}</div>`; tip.hidden = false;
  tip.style.left = Math.max(8, innerWidth / 2 - 140) + 'px'; tip.style.top = '64px';
  clearTimeout(flashTimer); flashTimer = setTimeout(() => { tip.hidden = true; }, 2200);
}

// =====================================================================
// Events
// =====================================================================
$('#dsTabs').addEventListener('click', e => {
  const b = e.target.closest('[data-ds]'); if (!b || b.dataset.ds === state.ds) return;
  state.ds = b.dataset.ds; state.sel = null; state.mform = null; commit();
});
$('#newVisual').onclick = () => { state.edit = true; addVisual('column'); };
$('#modeBtn').onclick = () => { state.edit = !state.edit; if (!state.edit) state.sel = null; renderAll(); };
$('#themeBtn').onclick = () => {
  const dark = state.theme ? state.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  state.theme = dark ? 'light' : 'dark'; save(); renderAll();
};
let resetTimer;
$('#resetBtn').onclick = () => {
  if (!state.resetArmed) { state.resetArmed = true; renderHead(); clearTimeout(resetTimer); resetTimer = setTimeout(() => { state.resetArmed = false; renderHead(); }, 3000); return; }
  state.resetArmed = false; clearTimeout(resetTimer);
  const ds = DS(); state.reports[ds.id] = { visuals: ds.report(), filters: [], measures: rep().measures };
  state.sel = null; compiled.clear(); commit();
};

// canvas: selection, cross-filtering, visual actions
canvas.addEventListener('click', e => {
  if (e.target.closest('[data-new]')) return addVisual('column');
  const vis = e.target.closest('.visual[data-vid]');
  if (!vis) { if (state.sel) { state.sel = null; renderAll(); } return; }
  const v = findV(vis.dataset.vid);
  const act = e.target.closest('[data-act]');
  if (act) {
    if (act.dataset.act === 'table') { v.asTable = !v.asTable; return commit(); }
    if (act.dataset.act === 'csv') return exportCsv(v);
    if (act.dataset.act === 'del') { rep().visuals = rep().visuals.filter(x => x !== v); if (state.sel === v.id) state.sel = null; return commit(); }
    if (act.dataset.act === 'sort') {
      const col = +act.dataset.col, cur = v.sort || (v.wells.values.length ? { col: v.wells.columns.length, dir: -1 } : { col: 0, dir: 1 });
      v.sort = { col, dir: cur.col === col ? -cur.dir : (col < v.wells.columns.length ? 1 : -1) };
      return commit();
    }
  }
  if (state.edit) state.sel = v.id;
  const mk = e.target.closest('[data-x]');
  if (mk && mk.dataset.f && mk.dataset.x !== OTHER) return crossFilter(v, mk.dataset.f, mk.dataset.x);
  renderAll();
});

// tooltips + line crosshair
const tip = $('#tip');
function placeTip(e) {
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14;
  if (y + h > innerHeight - 8) y = e.clientY - h - 14;
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
}
function clearHover() { canvas.querySelectorAll('.hov').forEach(g => { g.innerHTML = ''; }); }
canvas.addEventListener('pointermove', e => {
  const ov = e.target.closest && e.target.closest('.lineov');
  if (ov) {
    const m = lineMeta.get(ov.dataset.vid); if (!m) return;
    const svg = ov.ownerSVGElement, x = e.clientX - svg.getBoundingClientRect().left;
    let i = 0; m.xs.forEach((xx, j) => { if (Math.abs(xx - x) < Math.abs(m.xs[i] - x)) i = j; });
    const d = m.d;
    ov.setAttribute('data-x', d.cats[i]);
    svg.querySelector('.hov').innerHTML = `<line class="xh" x1="${m.xs[i]}" x2="${m.xs[i]}" y1="${m.mt}" y2="${m.H - m.mb}"/>` +
      d.series.map(s => s.values[i] == null ? '' : `<circle cx="${m.xs[i]}" cy="${m.ax.px(s.values[i])}" r="4" fill="${s.color || 'var(--s1)'}" stroke="var(--surface)" stroke-width="2"/>`).join('');
    const entries = d.series.filter(s => s.values[i] != null).sort((a, b) => b.values[i] - a.values[i])
      .map(s => ({ color: s.color || 'var(--s1)', label: s.label, value: fmtVal(s.values[i], d.meas.fmt, 'full') }));
    tip.innerHTML = tipHtml(fmtCat(d.af, d.cats[i]), entries); tip.hidden = false; placeTip(e);
    return;
  }
  clearHover();
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (t) { tip.innerHTML = t.getAttribute('data-tip'); tip.hidden = false; placeTip(e); }
  else tip.hidden = true;
});
canvas.addEventListener('pointerleave', () => { tip.hidden = true; clearHover(); });

// filter row + popovers
const pop = $('#pop');
let popCtx = null;
function openPop(anchor, html, ctx) {
  pop.innerHTML = html; pop.hidden = false; popCtx = ctx;
  const r = anchor.getBoundingClientRect();
  pop.style.left = Math.max(8, Math.min(r.left, innerWidth - pop.offsetWidth - 8)) + 'px';
  pop.style.top = Math.min(r.bottom + 6, innerHeight - pop.offsetHeight - 8) + 'px';
  const s = pop.querySelector('input[type=search]'); if (s) s.focus();
}
function closePop() { pop.hidden = true; popCtx = null; }
function filterPopHtml(f, q = '') {
  const vals = distinct(f.field).filter(x => fmtCat(f.field, x).toLowerCase().includes(q.toLowerCase()));
  const set = new Set(f.values);
  return `<h3>${esc(f.field)}</h3>${distinct(f.field).length > 10 ? `<input type="search" placeholder="Search" value="${esc(q)}" aria-label="Search values">` : ''}
    <div class="opts">${vals.map(x => `<div class="opt" role="checkbox" aria-checked="${set.has(x)}" tabindex="0" data-val="${esc(x)}"><span class="ck">${set.has(x) ? '✓' : ''}</span>${esc(fmtCat(f.field, x))}</div>`).join('')}</div>
    <div class="foot"><button class="linkish" data-fall="1">Show all</button><button class="linkish" data-fclose="1">Done</button></div>`;
}
function openFilterPop(fid) {
  const f = rep().filters.find(x => x.id === fid), chip = $(`#filterbar [data-fid="${CSS.escape(fid)}"]`);
  if (f && chip) openPop(chip, filterPopHtml(f), { kind: 'filter', fid, q: '' });
}
$('#filterbar').addEventListener('click', e => {
  const rm = e.target.closest('[data-rmf]');
  if (rm) { rep().filters = rep().filters.filter(f => f.id !== rm.dataset.rmf); closePop(); return commit(); }
  if (e.target.closest('[data-clearf]')) { rep().filters = []; closePop(); return commit(); }
  const p = e.target.closest('[data-pop]'); if (!p) return;
  if (p.dataset.pop === 'filter') return openFilterPop(p.dataset.fid);
  const ds = DS(), taken = new Set(rep().filters.filter(f => !f.source).map(f => f.field));
  openPop(p, `<h3>Filter on…</h3>${ds.fields.filter(f => f.type !== 'num' && !taken.has(f.name)).map(f =>
    `<div class="opt" tabindex="0" data-addf="${esc(f.name)}"><span class="ck">${f.type === 'time' ? '◷' : 'Aa'}</span>${esc(f.name)}</div>`).join('') || '<div class="hint">Every category already has a filter.</div>'}`, { kind: 'add' });
});
function popActivate(e) {
  if (!popCtx) return;
  const add = e.target.closest('[data-addf]');
  if (add) {
    const f = { id: uid(), field: add.dataset.addf, values: [], source: null };
    rep().filters.push(f); closePop(); commit(); return openFilterPop(f.id);
  }
  const f = popCtx.kind === 'filter' && rep().filters.find(x => x.id === popCtx.fid);
  if (!f) return;
  if (e.target.closest('[data-fclose]')) return closePop();
  if (e.target.closest('[data-fall]')) f.values = [];
  const o = e.target.closest('[data-val]');
  if (o) { const x = o.dataset.val; f.values = f.values.includes(x) ? f.values.filter(y => y !== x) : [...f.values, x]; }
  if (f.source) f.source = null;          // editing a cross-filter by hand turns it into a normal filter
  const ctx = popCtx; commit();
  const chip = $(`#filterbar [data-fid="${CSS.escape(f.id)}"]`);
  if (chip) { const st = pop.querySelector('.opts') && pop.querySelector('.opts').scrollTop; openPop(chip, filterPopHtml(f, ctx.q), ctx); if (st) pop.querySelector('.opts').scrollTop = st; }
}
pop.addEventListener('click', popActivate);
pop.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('.opt')) { e.preventDefault(); popActivate(e); } if (e.key === 'Escape') closePop(); });
pop.addEventListener('input', e => {
  if (!popCtx || popCtx.kind !== 'filter' || e.target.type !== 'search') return;
  popCtx.q = e.target.value;
  const f = rep().filters.find(x => x.id === popCtx.fid);
  const tmp = document.createElement('div'); tmp.innerHTML = filterPopHtml(f, popCtx.q);
  pop.querySelector('.opts').replaceWith(tmp.querySelector('.opts'));
});
document.addEventListener('pointerdown', e => { if (!pop.hidden && !pop.contains(e.target) && !e.target.closest('[data-pop]')) closePop(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closePop(); tip.hidden = true; } });

// visualizations pane
const vizPane = $('#vizPane');
vizPane.addEventListener('click', e => {
  const v = state.sel && findV(state.sel);
  const t = e.target.closest('[data-type]');
  if (t) { if (v) { setType(v, t.dataset.type); return commit(); } return addVisual(t.dataset.type); }
  if (!v) return;
  const rm = e.target.closest('[data-rmw]');
  if (rm) { const [k, i] = rm.dataset.rmw.split(':'); v.wells[k].splice(+i, 1); return commit(); }
  const sp = e.target.closest('[data-span]');
  if (sp) { v.span = +sp.dataset.span; return commit(); }
  const mv = e.target.closest('[data-move]');
  if (mv) {
    const list = rep().visuals, i = list.indexOf(v), j = i + +mv.dataset.move;
    if (j >= 0 && j < list.length) { [list[i], list[j]] = [list[j], list[i]]; commit(); }
    return;
  }
  if (e.target.closest('[data-delv]')) { rep().visuals = rep().visuals.filter(x => x !== v); state.sel = null; return commit(); }
});
vizPane.addEventListener('change', e => {
  const v = state.sel && findV(state.sel); if (!v) return;
  if (e.target.dataset.agg) { const [k, i] = e.target.dataset.agg.split(':'); v.wells[k][+i].agg = e.target.value; return commit(); }
  if (e.target.id === 'vtitle') { v.title = e.target.value.trim() || undefined; return commit(); }
});
vizPane.addEventListener('keydown', e => { if (e.target.id === 'vtitle' && e.key === 'Enter') e.target.blur(); });

// drag & drop from the Data pane onto wells
let dragRef = null;
const fieldsPane = $('#fieldsPane');
fieldsPane.addEventListener('dragstart', e => {
  const f = e.target.closest('[data-ref]'); if (!f) return;
  dragRef = JSON.parse(f.dataset.ref); e.dataTransfer.setData('text/plain', f.dataset.ref); e.dataTransfer.effectAllowed = 'copy';
});
fieldsPane.addEventListener('dragend', () => { dragRef = null; });
vizPane.addEventListener('dragover', e => { const d = e.target.closest('.drop'); if (d && dragRef) { e.preventDefault(); d.classList.add('over'); } });
vizPane.addEventListener('dragleave', e => { const d = e.target.closest('.drop'); if (d && !d.contains(e.relatedTarget)) d.classList.remove('over'); });
vizPane.addEventListener('drop', e => {
  const d = e.target.closest('.drop'), v = state.sel && findV(state.sel);
  if (!d || !dragRef || !v) return;
  e.preventDefault(); const ref = dragRef; dragRef = null; dropInto(v, d.dataset.well, ref);
});

// data pane: add fields, measures
fieldsPane.addEventListener('click', e => {
  if (e.target.closest('[data-mnew]')) { state.mform = { name: '', expr: '', fmt: 'number', edit: null }; renderPanes(); $('#mform').elements.mname.focus(); return; }
  if (e.target.closest('[data-mcancel]')) { state.mform = null; return renderPanes(); }
  const ed = e.target.closest('[data-medit]');
  if (ed) { const m = rep().measures[+ed.dataset.medit]; state.mform = { name: m.name, expr: m.expr, fmt: m.fmt, edit: m.name }; renderPanes(); checkMeasure(); return; }
  const del = e.target.closest('[data-mdel]');
  if (del) {
    const m = rep().measures[+del.dataset.mdel];
    rep().measures.splice(+del.dataset.mdel, 1);
    for (const v of rep().visuals) for (const k of Object.keys(v.wells)) v.wells[k] = v.wells[k].filter(it => !(it.kind === 'measure' && it.name === m.name));
    compiled.clear(); return commit();
  }
  const f = e.target.closest('[data-ref]');
  if (f && !e.target.closest('.ops')) addRef(JSON.parse(f.dataset.ref));
});
fieldsPane.addEventListener('keydown', e => {
  const f = e.target.closest('[data-ref]');
  if (f && (e.key === 'Enter' || e.key === ' ') && e.target === f) { e.preventDefault(); addRef(JSON.parse(f.dataset.ref)); }
});
fieldsPane.addEventListener('input', e => { if (e.target.closest('#mform')) checkMeasure(); });
fieldsPane.addEventListener('submit', e => {
  e.preventDefault();
  const c = checkMeasure(), m = state.mform, msg = $('#mmsg');
  if (!m.name) { msg.className = 'msg err'; msg.textContent = 'Give the measure a name.'; return; }
  const clash = DS().fields.some(f => f.name.toLowerCase() === m.name.toLowerCase()) ||
    allMeasures().some(x => x.name.toLowerCase() === m.name.toLowerCase() && x.name !== m.edit);
  if (clash) { msg.className = 'msg err'; msg.textContent = `“${m.name}” is already taken.`; return; }
  if (!c) { if (!m.expr.trim()) { msg.className = 'msg err'; msg.textContent = 'Write an expression.'; } return; }
  const list = rep().measures;
  if (m.edit) {
    const cur = list.find(x => x.name === m.edit);
    Object.assign(cur, { name: m.name, expr: m.expr, fmt: m.fmt });
    for (const v of rep().visuals) for (const k of Object.keys(v.wells)) v.wells[k].forEach(it => { if (it.kind === 'measure' && it.name === m.edit) it.name = m.name; });
  } else list.push({ name: m.name, expr: m.expr, fmt: m.fmt });
  state.mform = null; compiled.clear(); commit();
});

// re-lay out charts when their width changes
let lastW = 0, rafId = 0;
new ResizeObserver(() => {
  const w = canvas.clientWidth; if (Math.abs(w - lastW) < 2) return; lastW = w;
  cancelAnimationFrame(rafId); rafId = requestAnimationFrame(renderCanvas);
}).observe(canvas);

renderAll();
</script>
</body>
</html>
