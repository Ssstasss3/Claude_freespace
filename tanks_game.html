<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Танчики на двоих - Tanks Battle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            color: white;
        }

        .game-container {
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            background: linear-gradient(45deg, #00d4ff, #ff00ea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        canvas {
            border: 4px solid #00d4ff;
            border-radius: 10px;
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.5);
            background: #0a0a1a;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            justify-content: space-around;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .player-controls {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        .player-controls h3 {
            margin-bottom: 10px;
        }

        .player1 h3 {
            color: #00d4ff;
        }

        .player2 h3 {
            color: #ff00ea;
        }

        .controls p {
            margin: 5px 0;
            font-size: 0.9em;
        }

        .restart-hint {
            margin-top: 15px;
            font-size: 0.9em;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>ТАНЧИКИ НА ДВОИХ</h1>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div class="controls">
            <div class="player-controls player1">
                <h3>PLAYER 1 (Blue)</h3>
                <p>Move: W A S D</p>
                <p>Shoot: Q</p>
            </div>
            <div class="player-controls player2">
                <h3>PLAYER 2 (Pink)</h3>
                <p>Move: Arrow Keys</p>
                <p>Shoot: Enter</p>
            </div>
        </div>
        <p class="restart-hint">Press R to restart game</p>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game state
        let gameOver = false;
        let winner = null;

        // Keyboard state
        const keys = {};

        // Obstacles
        const obstacles = [
            { x: 200, y: 150, width: 60, height: 60 },
            { x: 540, y: 150, width: 60, height: 60 },
            { x: 370, y: 270, width: 60, height: 60 },
            { x: 100, y: 400, width: 80, height: 40 },
            { x: 620, y: 400, width: 80, height: 40 },
            { x: 350, y: 50, width: 100, height: 30 },
            { x: 350, y: 520, width: 100, height: 30 },
        ];

        // Tank class
        class Tank {
            constructor(x, y, color, controls) {
                this.x = x;
                this.y = y;
                this.width = 40;
                this.height = 40;
                this.color = color;
                this.angle = 0;
                this.speed = 3;
                this.health = 100;
                this.maxHealth = 100;
                this.controls = controls;
                this.shootCooldown = 0;
                this.shootDelay = 20;
            }

            update() {
                if (gameOver) return;

                // Store old position for collision detection
                const oldX = this.x;
                const oldY = this.y;

                // Movement
                if (keys[this.controls.up]) {
                    this.y -= this.speed;
                    this.angle = -Math.PI / 2;
                }
                if (keys[this.controls.down]) {
                    this.y += this.speed;
                    this.angle = Math.PI / 2;
                }
                if (keys[this.controls.left]) {
                    this.x -= this.speed;
                    this.angle = Math.PI;
                }
                if (keys[this.controls.right]) {
                    this.x += this.speed;
                    this.angle = 0;
                }

                // Boundary collision
                if (this.x < 0 || this.x + this.width > canvas.width ||
                    this.y < 0 || this.y + this.height > canvas.height) {
                    this.x = oldX;
                    this.y = oldY;
                }

                // Obstacle collision
                for (let obs of obstacles) {
                    if (this.collidesWith(obs)) {
                        this.x = oldX;
                        this.y = oldY;
                        break;
                    }
                }

                // Shooting
                if (this.shootCooldown > 0) {
                    this.shootCooldown--;
                }

                if (keys[this.controls.shoot] && this.shootCooldown === 0) {
                    this.shoot();
                    this.shootCooldown = this.shootDelay;
                }
            }

            shoot() {
                const bulletSpeed = 8;
                const centerX = this.x + this.width / 2;
                const centerY = this.y + this.height / 2;

                bullets.push(new Bullet(
                    centerX,
                    centerY,
                    Math.cos(this.angle) * bulletSpeed,
                    Math.sin(this.angle) * bulletSpeed,
                    this
                ));
            }

            collidesWith(rect) {
                return this.x < rect.x + rect.width &&
                       this.x + this.width > rect.x &&
                       this.y < rect.y + rect.height &&
                       this.y + this.height > rect.y;
            }

            takeDamage(amount) {
                this.health -= amount;
                if (this.health <= 0) {
                    this.health = 0;
                    gameOver = true;
                    winner = this === player1 ? 'Player 2' : 'Player 1';
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);

                // Draw tank body
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.width / 2, -this.height / 2, this.width, this.height);

                // Draw tank turret
                ctx.fillStyle = this.color;
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, 12, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Draw barrel
                ctx.fillStyle = this.color;
                ctx.save();
                ctx.rotate(this.angle);
                ctx.fillRect(0, -4, 25, 8);
                ctx.restore();

                ctx.restore();

                // Draw health bar
                const barWidth = 50;
                const barHeight = 6;
                const barX = this.x + this.width / 2 - barWidth / 2;
                const barY = this.y - 15;

                ctx.fillStyle = 'rgba(255, 0, 0, 0.5)';
                ctx.fillRect(barX, barY, barWidth, barHeight);

                ctx.fillStyle = this.color;
                ctx.fillRect(barX, barY, barWidth * (this.health / this.maxHealth), barHeight);

                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1;
                ctx.strokeRect(barX, barY, barWidth, barHeight);
            }
        }

        // Bullet class
        class Bullet {
            constructor(x, y, vx, vy, owner) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.radius = 5;
                this.owner = owner;
                this.bounces = 3;
                this.damage = 15;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // Bounce off walls
                if (this.x - this.radius < 0 || this.x + this.radius > canvas.width) {
                    this.vx *= -1;
                    this.x = Math.max(this.radius, Math.min(canvas.width - this.radius, this.x));
                    this.bounces--;
                }
                if (this.y - this.radius < 0 || this.y + this.radius > canvas.height) {
                    this.vy *= -1;
                    this.y = Math.max(this.radius, Math.min(canvas.height - this.radius, this.y));
                    this.bounces--;
                }

                // Bounce off obstacles
                for (let obs of obstacles) {
                    if (this.x + this.radius > obs.x && this.x - this.radius < obs.x + obs.width &&
                        this.y + this.radius > obs.y && this.y - this.radius < obs.y + obs.height) {

                        // Determine bounce direction
                        const fromLeft = this.x < obs.x;
                        const fromRight = this.x > obs.x + obs.width;
                        const fromTop = this.y < obs.y;
                        const fromBottom = this.y > obs.y + obs.height;

                        if (fromLeft || fromRight) this.vx *= -1;
                        if (fromTop || fromBottom) this.vy *= -1;

                        this.bounces--;
                        break;
                    }
                }

                // Check collision with tanks
                if (this.owner !== player1 && this.circleCollidesRect(player1)) {
                    player1.takeDamage(this.damage);
                    return true; // Mark for removal
                }
                if (this.owner !== player2 && this.circleCollidesRect(player2)) {
                    player2.takeDamage(this.damage);
                    return true; // Mark for removal
                }

                return this.bounces <= 0;
            }

            circleCollidesRect(rect) {
                const closestX = Math.max(rect.x, Math.min(this.x, rect.x + rect.width));
                const closestY = Math.max(rect.y, Math.min(this.y, rect.y + rect.height));
                const distX = this.x - closestX;
                const distY = this.y - closestY;
                return (distX * distX + distY * distY) < (this.radius * this.radius);
            }

            draw() {
                ctx.fillStyle = '#ffff00';
                ctx.strokeStyle = '#ff8800';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Trail effect
                ctx.fillStyle = 'rgba(255, 255, 0, 0.3)';
                ctx.beginPath();
                ctx.arc(this.x - this.vx, this.y - this.vy, this.radius * 0.7, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Create players
        const player1 = new Tank(50, 50, '#00d4ff', {
            up: 'w',
            down: 's',
            left: 'a',
            right: 'd',
            shoot: 'q'
        });

        const player2 = new Tank(canvas.width - 90, canvas.height - 90, '#ff00ea', {
            up: 'ArrowUp',
            down: 'ArrowDown',
            left: 'ArrowLeft',
            right: 'ArrowRight',
            shoot: 'Enter'
        });

        const bullets = [];

        // Event listeners
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;

            if (e.key === 'r' || e.key === 'R') {
                resetGame();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        function resetGame() {
            gameOver = false;
            winner = null;
            bullets.length = 0;

            player1.x = 50;
            player1.y = 50;
            player1.health = 100;
            player1.angle = 0;

            player2.x = canvas.width - 90;
            player2.y = canvas.height - 90;
            player2.health = 100;
            player2.angle = 0;
        }

        function drawObstacles() {
            ctx.fillStyle = '#2a2a3a';
            ctx.strokeStyle = '#4a4a5a';
            ctx.lineWidth = 2;

            for (let obs of obstacles) {
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);

                // Add texture
                ctx.fillStyle = '#3a3a4a';
                ctx.fillRect(obs.x + 5, obs.y + 5, obs.width - 10, obs.height - 10);
                ctx.fillStyle = '#2a2a3a';
            }
        }

        function drawGameOver() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = 'bold 60px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const gradient = ctx.createLinearGradient(0, 0, canvas.width, 0);
            gradient.addColorStop(0, '#00d4ff');
            gradient.addColorStop(1, '#ff00ea');
            ctx.fillStyle = gradient;

            ctx.fillText(`${winner} WINS!`, canvas.width / 2, canvas.height / 2 - 30);

            ctx.font = '24px Arial';
            ctx.fillStyle = '#ffffff';
            ctx.fillText('Press R to restart', canvas.width / 2, canvas.height / 2 + 40);
        }

        // Game loop
        function gameLoop() {
            // Clear canvas
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid background
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i < canvas.height; i += 40) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            // Draw obstacles
            drawObstacles();

            // Update and draw bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                if (bullets[i].update()) {
                    bullets.splice(i, 1);
                } else {
                    bullets[i].draw();
                }
            }

            // Update and draw players
            player1.update();
            player2.update();
            player1.draw();
            player2.draw();

            // Draw game over screen
            if (gameOver) {
                drawGameOver();
            }

            requestAnimationFrame(gameLoop);
        }

        // Start game
        gameLoop();
    </script>
</body>
</html>
