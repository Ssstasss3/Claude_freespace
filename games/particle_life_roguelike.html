<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PARTICLE LIFE ROGUELIKE: The Emergent Dungeon</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Share Tech Mono', monospace;
            background: #000;
            color: #0f0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 1400px;
            height: 100vh;
            display: flex;
        }

        #canvasContainer {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            border: 2px solid #0f0;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
            image-rendering: pixelated;
        }

        #sidebar {
            width: 300px;
            background: rgba(0, 0, 0, 0.9);
            border-left: 2px solid #0f0;
            padding: 20px;
            overflow-y: auto;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            margin-bottom: 20px;
            text-align: center;
            background: linear-gradient(135deg, #0f0, #0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-section {
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid #0f0;
            border-radius: 5px;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.7;
        }

        .stat-value {
            font-size: 18px;
            color: #0ff;
            margin: 5px 0;
        }

        .bar {
            height: 10px;
            background: #001100;
            border: 1px solid #0f0;
            margin: 5px 0;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #0f0, #0ff);
            transition: width 0.3s;
        }

        .log {
            font-size: 11px;
            height: 150px;
            overflow-y: auto;
            padding: 10px;
            background: rgba(0, 255, 0, 0.05);
            border: 1px solid #0f0;
            margin-top: 10px;
        }

        .log-entry {
            margin: 2px 0;
            opacity: 0.8;
        }

        .log-entry.damage { color: #f00; }
        .log-entry.heal { color: #0ff; }
        .log-entry.pickup { color: #ff0; }

        button {
            background: transparent;
            border: 1px solid #0f0;
            color: #0f0;
            padding: 5px 10px;
            margin: 5px;
            cursor: pointer;
            font-family: 'Share Tech Mono', monospace;
            transition: all 0.2s;
        }

        button:hover {
            background: rgba(0, 255, 0, 0.2);
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        #controls {
            margin-top: 20px;
            font-size: 11px;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="canvasContainer">
            <canvas id="gameCanvas" width="800" height="800"></canvas>
        </div>
        <div id="sidebar">
            <h1>PARTICLE LIFE<br>ROGUELIKE</h1>

            <div class="stat-section">
                <div class="stat-label">HEALTH</div>
                <div class="bar"><div class="bar-fill" id="hpBar" style="width: 100%"></div></div>
                <div class="stat-value" id="hpValue">100 / 100</div>
            </div>

            <div class="stat-section">
                <div class="stat-label">LEVEL <span id="level">1</span></div>
                <div class="stat-label">XP</div>
                <div class="bar"><div class="bar-fill" id="xpBar" style="width: 0%"></div></div>
                <div class="stat-value" id="xpValue">0 / 100</div>
            </div>

            <div class="stat-section">
                <div class="stat-label">FLOOR</div>
                <div class="stat-value" id="floor">1</div>
                <div class="stat-label">TEMPERATURE</div>
                <div class="stat-value" id="temperature">0.50</div>
            </div>

            <div class="stat-section">
                <div class="stat-label">EQUIPMENT</div>
                <div id="equipment">
                    <div>Weapon: <span id="weapon">None</span></div>
                    <div>Armor: <span id="armor">None</span></div>
                </div>
            </div>

            <div class="stat-section">
                <div class="stat-label">INTERACTION MATRIX</div>
                <div id="matrixDisplay" style="font-size: 10px;">
                    <!-- Opus will populate this -->
                </div>
            </div>

            <div class="stat-section">
                <button onclick="game.newGame()">NEW GAME</button>
                <button onclick="game.descend()">DESCEND ▼</button>
            </div>

            <div id="controls">
                <div>WASD / Arrow Keys - Move</div>
                <div>Space - Wait</div>
                <div>E - Pick up item</div>
                <div>Q - Use ability</div>
            </div>

            <div class="log" id="gameLog">
                <div class="log-entry">Welcome to the Particle Life Roguelike...</div>
                <div class="log-entry">The dungeon is alive. It watches you.</div>
            </div>
        </div>
    </div>

    <script>
        // ========================================================================
        // === SONNET'S SECTION: GAME LOGIC, ENTITIES, COMBAT ===
        // ========================================================================

        const GRID_SIZE = 50;
        const TILE_SIZE = 16;

        class Entity {
            constructor(x, y, type, hp = 100) {
                this.x = x;
                this.y = y;
                this.type = type; // 'player', 'enemy', 'item'
                this.hp = hp;
                this.maxHp = hp;
                this.damage = 10;
                this.alive = true;
            }

            move(dx, dy) {
                const newX = this.x + dx;
                const newY = this.y + dy;

                if (newX >= 0 && newX < GRID_SIZE && newY >= 0 && newY < GRID_SIZE) {
                    this.x = newX;
                    this.y = newY;
                    return true;
                }
                return false;
            }

            takeDamage(amount) {
                this.hp -= amount;
                if (this.hp <= 0) {
                    this.hp = 0;
                    this.alive = false;
                }
            }
        }

        class Player extends Entity {
            constructor(x, y) {
                super(x, y, 'player', 100);
                this.level = 1;
                this.xp = 0;
                this.xpToLevel = 100;
                this.weapon = null;
                this.armor = null;
            }

            gainXP(amount) {
                this.xp += amount;
                if (this.xp >= this.xpToLevel) {
                    this.levelUp();
                }
            }

            levelUp() {
                this.level++;
                this.xp = 0;
                this.xpToLevel = Math.floor(this.xpToLevel * 1.5);
                this.maxHp += 20;
                this.hp = this.maxHp;
                this.damage += 5;
                game.log('Level up! You are now level ' + this.level, 'heal');
            }
        }

        class Enemy extends Entity {
            constructor(x, y, level) {
                const hp = 30 + level * 10;
                super(x, y, 'enemy', hp);
                this.level = level;
                this.damage = 5 + level * 2;
                this.xpReward = 20 + level * 10;
            }

            // Simple AI: move towards player
            act(player) {
                const dx = Math.sign(player.x - this.x);
                const dy = Math.sign(player.y - this.y);

                // Try to move towards player
                if (Math.abs(player.x - this.x) > Math.abs(player.y - this.y)) {
                    if (!this.move(dx, 0)) this.move(0, dy);
                } else {
                    if (!this.move(0, dy)) this.move(dx, 0);
                }

                // Attack if adjacent
                if (Math.abs(player.x - this.x) <= 1 && Math.abs(player.y - this.y) <= 1) {
                    this.attack(player);
                }
            }

            attack(target) {
                target.takeDamage(this.damage);
                game.log('Enemy hits you for ' + this.damage + ' damage!', 'damage');
            }
        }

        class GameState {
            constructor() {
                this.player = null;
                this.enemies = [];
                this.items = [];
                this.floor = 1;
                this.temperature = 0.5;
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.logEntries = [];
            }

            newGame() {
                this.floor = 1;
                this.temperature = 0.5;
                this.player = new Player(GRID_SIZE / 2, GRID_SIZE / 2);
                this.enemies = [];
                this.items = [];
                this.logEntries = [];

                this.generateFloor();
                this.log('New game started. Good luck.', 'heal');
                this.render();
            }

            generateFloor() {
                // Generate enemies based on floor level
                const numEnemies = 3 + this.floor * 2;
                this.enemies = [];

                for (let i = 0; i < numEnemies; i++) {
                    let x, y;
                    do {
                        x = Math.floor(Math.random() * GRID_SIZE);
                        y = Math.floor(Math.random() * GRID_SIZE);
                    } while (this.distanceToPlayer(x, y) < 10);

                    this.enemies.push(new Enemy(x, y, this.floor));
                }

                this.temperature = 0.3 + (this.floor * 0.05);
                this.log('Descended to floor ' + this.floor);

                // Opus will add particle-based floor generation here
                if (window.particleEngine) {
                    particleEngine.generateDungeon(this.floor, this.temperature);
                }
            }

            descend() {
                if (this.enemies.length > 0) {
                    this.log('Clear all enemies first!', 'damage');
                    return;
                }
                this.floor++;
                this.player.x = GRID_SIZE / 2;
                this.player.y = GRID_SIZE / 2;
                this.generateFloor();
                this.render();
            }

            distanceToPlayer(x, y) {
                const dx = this.player.x - x;
                const dy = this.player.y - y;
                return Math.sqrt(dx * dx + dy * dy);
            }

            handlePlayerMove(dx, dy) {
                if (!this.player || !this.player.alive) return;

                const newX = this.player.x + dx;
                const newY = this.player.y + dy;

                // Check for enemy collision
                const enemy = this.enemies.find(e => e.alive && e.x === newX && e.y === newY);
                if (enemy) {
                    this.playerAttack(enemy);
                } else if (this.player.move(dx, dy)) {
                    this.enemyTurn();
                }

                this.render();
            }

            playerAttack(enemy) {
                enemy.takeDamage(this.player.damage);
                this.log('You hit enemy for ' + this.player.damage + ' damage!');

                if (!enemy.alive) {
                    this.player.gainXP(enemy.xpReward);
                    this.log('Enemy defeated! +' + enemy.xpReward + ' XP', 'pickup');
                } else {
                    this.enemyTurn();
                }
            }

            enemyTurn() {
                this.enemies.forEach(enemy => {
                    if (enemy.alive) {
                        enemy.act(this.player);
                    }
                });

                if (!this.player.alive) {
                    this.log('You died! Game over.', 'damage');
                }
            }

            log(message, type = '') {
                this.logEntries.push({ message, type });
                if (this.logEntries.length > 20) {
                    this.logEntries.shift();
                }

                const logDiv = document.getElementById('gameLog');
                const entry = document.createElement('div');
                entry.className = 'log-entry ' + type;
                entry.textContent = message;
                logDiv.appendChild(entry);
                logDiv.scrollTop = logDiv.scrollHeight;
            }

            updateUI() {
                // Update health bar
                const hpPercent = (this.player.hp / this.player.maxHp) * 100;
                document.getElementById('hpBar').style.width = hpPercent + '%';
                document.getElementById('hpValue').textContent = this.player.hp + ' / ' + this.player.maxHp;

                // Update XP bar
                const xpPercent = (this.player.xp / this.player.xpToLevel) * 100;
                document.getElementById('xpBar').style.width = xpPercent + '%';
                document.getElementById('xpValue').textContent = this.player.xp + ' / ' + this.player.xpToLevel;

                // Update other stats
                document.getElementById('level').textContent = this.player.level;
                document.getElementById('floor').textContent = this.floor;
                document.getElementById('temperature').textContent = this.temperature.toFixed(2);
                document.getElementById('weapon').textContent = this.player.weapon || 'None';
                document.getElementById('armor').textContent = this.player.armor || 'None';
            }

            render() {
                if (!this.player) return;

                this.updateUI();

                // Clear canvas
                this.ctx.fillStyle = '#000';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // === OPUS: Your particle rendering goes here ===
                // Call your particle engine rendering
                if (window.particleEngine) {
                    particleEngine.render(this.ctx, this.player, this.enemies);
                } else {
                    // Fallback simple rendering
                    this.renderSimple();
                }
            }

            renderSimple() {
                // Simple fallback rendering (before Opus adds particle engine)
                const cellSize = this.canvas.width / GRID_SIZE;

                // Draw grid
                this.ctx.strokeStyle = '#001100';
                for (let i = 0; i <= GRID_SIZE; i++) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(i * cellSize, 0);
                    this.ctx.lineTo(i * cellSize, this.canvas.height);
                    this.ctx.stroke();
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, i * cellSize);
                    this.ctx.lineTo(this.canvas.width, i * cellSize);
                    this.ctx.stroke();
                }

                // Draw player
                this.ctx.fillStyle = '#0ff';
                this.ctx.fillRect(
                    this.player.x * cellSize + 2,
                    this.player.y * cellSize + 2,
                    cellSize - 4,
                    cellSize - 4
                );

                // Draw enemies
                this.enemies.forEach(enemy => {
                    if (enemy.alive) {
                        this.ctx.fillStyle = '#f00';
                        this.ctx.fillRect(
                            enemy.x * cellSize + 2,
                            enemy.y * cellSize + 2,
                            cellSize - 4,
                            cellSize - 4
                        );
                    }
                });
            }
        }

        // ========================================================================
        // === OPUS'S SECTION: PARTICLE ENGINE ===
        // ========================================================================

        // TODO: Opus, add your particle engine here!
        //
        // Suggested structure:
        // class ParticleEngine {
        //     constructor() {
        //         this.particles = [];
        //         this.interactionMatrix = this.createMatrix();
        //     }
        //
        //     createMatrix() {
        //         // Your attraction/repulsion matrices
        //     }
        //
        //     generateDungeon(floor, temperature) {
        //         // Generate particles that settle into dungeon layout
        //     }
        //
        //     update(dt) {
        //         // Update particle physics
        //     }
        //
        //     render(ctx, player, enemies) {
        //         // Render particles with visual effects
        //     }
        // }
        //
        // window.particleEngine = new ParticleEngine();

        // ========================================================================
        // === SONNET'S SECTION: INPUT HANDLING & INITIALIZATION ===
        // ========================================================================

        const game = new GameState();

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (!game.player || !game.player.alive) return;

            const key = e.key.toLowerCase();

            switch(key) {
                case 'w':
                case 'arrowup':
                    game.handlePlayerMove(0, -1);
                    break;
                case 's':
                case 'arrowdown':
                    game.handlePlayerMove(0, 1);
                    break;
                case 'a':
                case 'arrowleft':
                    game.handlePlayerMove(-1, 0);
                    break;
                case 'd':
                case 'arrowright':
                    game.handlePlayerMove(1, 0);
                    break;
                case ' ':
                    game.enemyTurn();
                    game.render();
                    break;
            }
        });

        // Initialize game
        window.addEventListener('load', () => {
            game.newGame();
        });

    </script>
</body>
</html>
