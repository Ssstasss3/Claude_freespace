<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Танчики на двоих</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background: #0a0a1a;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            font-family: 'Arial', sans-serif;
            touch-action: none;
        }

        #gameCanvas {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #0a0a1a;
            max-width: 100vw;
            max-height: 100vh;
        }

        .controls-container {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .player-controls {
            position: absolute;
            pointer-events: auto;
        }

        .player1-controls {
            bottom: 20px;
            left: 20px;
        }

        .player2-controls {
            top: 20px;
            right: 20px;
            transform: rotate(180deg);
        }

        .dpad {
            position: relative;
            width: 120px;
            height: 120px;
            display: inline-block;
        }

        .dpad-btn {
            position: absolute;
            width: 40px;
            height: 40px;
            background: rgba(0, 212, 255, 0.3);
            border: 2px solid rgba(0, 212, 255, 0.6);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: rgba(255, 255, 255, 0.8);
            font-weight: bold;
            touch-action: none;
        }

        .player2-controls .dpad-btn {
            background: rgba(255, 0, 234, 0.3);
            border-color: rgba(255, 0, 234, 0.6);
        }

        .dpad-btn.active {
            background: rgba(0, 212, 255, 0.7);
            border-color: rgba(0, 212, 255, 1);
            transform: scale(0.95);
        }

        .player2-controls .dpad-btn.active {
            background: rgba(255, 0, 234, 0.7);
            border-color: rgba(255, 0, 234, 1);
        }

        .dpad-up { top: 0; left: 40px; }
        .dpad-down { bottom: 0; left: 40px; }
        .dpad-left { top: 40px; left: 0; }
        .dpad-right { top: 40px; right: 0; }
        .dpad-center {
            top: 40px;
            left: 40px;
            background: rgba(0, 0, 0, 0.2);
            border-color: rgba(255, 255, 255, 0.2);
            pointer-events: none;
        }

        .fire-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(255, 68, 68, 0.4);
            border: 3px solid rgba(255, 68, 68, 0.7);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-left: 15px;
            vertical-align: bottom;
            font-size: 24px;
            color: white;
            font-weight: bold;
            touch-action: none;
        }

        .fire-btn.active {
            background: rgba(255, 68, 68, 0.9);
            border-color: rgba(255, 68, 68, 1);
            transform: scale(0.95);
        }

        .restart-btn {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 212, 255, 0.9);
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 24px;
            border-radius: 15px;
            font-weight: bold;
            display: none;
            pointer-events: auto;
            z-index: 1000;
            touch-action: none;
        }

        .restart-btn.show {
            display: block;
        }

        .health-indicator {
            position: fixed;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            color: white;
            font-size: 14px;
            pointer-events: none;
        }

        .p1-health {
            bottom: 150px;
            left: 20px;
            border: 2px solid rgba(0, 212, 255, 0.6);
        }

        .p2-health {
            top: 150px;
            right: 20px;
            border: 2px solid rgba(255, 0, 234, 0.6);
        }

        @media (orientation: portrait) {
            .player1-controls {
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
            }

            .player2-controls {
                top: 20px;
                left: 50%;
                right: auto;
                transform: translateX(-50%) rotate(0deg);
            }

            .p1-health {
                bottom: 160px;
                left: 50%;
                transform: translateX(-50%);
            }

            .p2-health {
                top: 160px;
                right: auto;
                left: 50%;
                transform: translateX(-50%);
            }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div class="controls-container">
        <!-- Player 1 Controls (Bottom) -->
        <div class="player-controls player1-controls">
            <div class="dpad">
                <div class="dpad-btn dpad-up" data-dir="up1">▲</div>
                <div class="dpad-btn dpad-down" data-dir="down1">▼</div>
                <div class="dpad-btn dpad-left" data-dir="left1">◄</div>
                <div class="dpad-btn dpad-right" data-dir="right1">►</div>
                <div class="dpad-btn dpad-center"></div>
            </div>
            <button class="fire-btn" data-fire="fire1">🔥</button>
        </div>

        <!-- Player 2 Controls (Top) -->
        <div class="player-controls player2-controls">
            <div class="dpad">
                <div class="dpad-btn dpad-up" data-dir="up2">▲</div>
                <div class="dpad-btn dpad-down" data-dir="down2">▼</div>
                <div class="dpad-btn dpad-left" data-dir="left2">◄</div>
                <div class="dpad-btn dpad-right" data-dir="right2">►</div>
                <div class="dpad-btn dpad-center"></div>
            </div>
            <button class="fire-btn" data-fire="fire2">🔥</button>
        </div>

        <!-- Health Indicators -->
        <div class="health-indicator p1-health">
            <div>P1: <span id="p1-health">100</span>%</div>
        </div>
        <div class="health-indicator p2-health">
            <div>P2: <span id="p2-health">100</span>%</div>
        </div>

        <!-- Restart Button -->
        <button class="restart-btn" id="restartBtn">RESTART</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Setup canvas size
        function resizeCanvas() {
            const aspectRatio = 16 / 10;
            let width = window.innerWidth;
            let height = window.innerHeight;

            if (width / height > aspectRatio) {
                width = height * aspectRatio;
            } else {
                height = width / aspectRatio;
            }

            canvas.width = Math.min(800, width);
            canvas.height = Math.min(500, height);
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Prevent default touch behaviors
        document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
        document.addEventListener('gesturestart', (e) => e.preventDefault());

        // Game state
        let gameOver = false;
        let winner = null;

        // Touch controls state
        const touchControls = {
            up1: false, down1: false, left1: false, right1: false, fire1: false,
            up2: false, down2: false, left2: false, right2: false, fire2: false
        };

        // Obstacles (scaled proportionally)
        const obstacles = [
            { x: 0.25, y: 0.3, width: 0.075, height: 0.12 },
            { x: 0.675, y: 0.3, width: 0.075, height: 0.12 },
            { x: 0.4625, y: 0.54, width: 0.075, height: 0.12 },
            { x: 0.125, y: 0.8, width: 0.1, height: 0.08 },
            { x: 0.775, y: 0.8, width: 0.1, height: 0.08 },
            { x: 0.4375, y: 0.1, width: 0.125, height: 0.06 },
            { x: 0.4375, y: 0.88, width: 0.125, height: 0.06 },
        ].map(obs => ({
            x: obs.x * canvas.width,
            y: obs.y * canvas.height,
            width: obs.width * canvas.width,
            height: obs.height * canvas.height
        }));

        // Tank class
        class Tank {
            constructor(x, y, color, controlPrefix) {
                this.x = x;
                this.y = y;
                this.width = canvas.width * 0.05;
                this.height = canvas.height * 0.08;
                this.color = color;
                this.angle = 0;
                this.speed = canvas.width * 0.004;
                this.health = 100;
                this.maxHealth = 100;
                this.controlPrefix = controlPrefix;
                this.shootCooldown = 0;
                this.shootDelay = 20;
            }

            update() {
                if (gameOver) return;

                const oldX = this.x;
                const oldY = this.y;

                // Movement
                if (touchControls[`up${this.controlPrefix}`]) {
                    this.y -= this.speed;
                    this.angle = -Math.PI / 2;
                }
                if (touchControls[`down${this.controlPrefix}`]) {
                    this.y += this.speed;
                    this.angle = Math.PI / 2;
                }
                if (touchControls[`left${this.controlPrefix}`]) {
                    this.x -= this.speed;
                    this.angle = Math.PI;
                }
                if (touchControls[`right${this.controlPrefix}`]) {
                    this.x += this.speed;
                    this.angle = 0;
                }

                // Boundary collision
                if (this.x < 0 || this.x + this.width > canvas.width ||
                    this.y < 0 || this.y + this.height > canvas.height) {
                    this.x = oldX;
                    this.y = oldY;
                }

                // Obstacle collision
                for (let obs of obstacles) {
                    if (this.collidesWith(obs)) {
                        this.x = oldX;
                        this.y = oldY;
                        break;
                    }
                }

                // Shooting
                if (this.shootCooldown > 0) {
                    this.shootCooldown--;
                }

                if (touchControls[`fire${this.controlPrefix}`] && this.shootCooldown === 0) {
                    this.shoot();
                    this.shootCooldown = this.shootDelay;
                }
            }

            shoot() {
                const bulletSpeed = canvas.width * 0.01;
                const centerX = this.x + this.width / 2;
                const centerY = this.y + this.height / 2;

                bullets.push(new Bullet(
                    centerX,
                    centerY,
                    Math.cos(this.angle) * bulletSpeed,
                    Math.sin(this.angle) * bulletSpeed,
                    this
                ));
            }

            collidesWith(rect) {
                return this.x < rect.x + rect.width &&
                       this.x + this.width > rect.x &&
                       this.y < rect.y + rect.height &&
                       this.y + this.height > rect.y;
            }

            takeDamage(amount) {
                this.health -= amount;
                if (this.health <= 0) {
                    this.health = 0;
                    gameOver = true;
                    winner = this === player1 ? 'Player 2' : 'Player 1';
                    document.getElementById('restartBtn').classList.add('show');
                }
                this.updateHealthDisplay();
            }

            updateHealthDisplay() {
                const id = this === player1 ? 'p1-health' : 'p2-health';
                document.getElementById(id).textContent = Math.max(0, Math.round(this.health));
            }

            draw() {
                ctx.save();
                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);

                // Draw tank body
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.width / 2, -this.height / 2, this.width, this.height);

                // Draw tank turret
                ctx.fillStyle = this.color;
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, this.width * 0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Draw barrel
                ctx.fillStyle = this.color;
                ctx.save();
                ctx.rotate(this.angle);
                ctx.fillRect(0, -this.width * 0.1, this.width * 0.625, this.width * 0.2);
                ctx.restore();

                ctx.restore();
            }
        }

        // Bullet class
        class Bullet {
            constructor(x, y, vx, vy, owner) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.radius = canvas.width * 0.00625;
                this.owner = owner;
                this.bounces = 3;
                this.damage = 15;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // Bounce off walls
                if (this.x - this.radius < 0 || this.x + this.radius > canvas.width) {
                    this.vx *= -1;
                    this.x = Math.max(this.radius, Math.min(canvas.width - this.radius, this.x));
                    this.bounces--;
                }
                if (this.y - this.radius < 0 || this.y + this.radius > canvas.height) {
                    this.vy *= -1;
                    this.y = Math.max(this.radius, Math.min(canvas.height - this.radius, this.y));
                    this.bounces--;
                }

                // Bounce off obstacles
                for (let obs of obstacles) {
                    if (this.x + this.radius > obs.x && this.x - this.radius < obs.x + obs.width &&
                        this.y + this.radius > obs.y && this.y - this.radius < obs.y + obs.height) {

                        const fromLeft = this.x < obs.x;
                        const fromRight = this.x > obs.x + obs.width;
                        const fromTop = this.y < obs.y;
                        const fromBottom = this.y > obs.y + obs.height;

                        if (fromLeft || fromRight) this.vx *= -1;
                        if (fromTop || fromBottom) this.vy *= -1;

                        this.bounces--;
                        break;
                    }
                }

                // Check collision with tanks
                if (this.owner !== player1 && this.circleCollidesRect(player1)) {
                    player1.takeDamage(this.damage);
                    return true;
                }
                if (this.owner !== player2 && this.circleCollidesRect(player2)) {
                    player2.takeDamage(this.damage);
                    return true;
                }

                return this.bounces <= 0;
            }

            circleCollidesRect(rect) {
                const closestX = Math.max(rect.x, Math.min(this.x, rect.x + rect.width));
                const closestY = Math.max(rect.y, Math.min(this.y, rect.y + rect.height));
                const distX = this.x - closestX;
                const distY = this.y - closestY;
                return (distX * distX + distY * distY) < (this.radius * this.radius);
            }

            draw() {
                ctx.fillStyle = '#ffff00';
                ctx.strokeStyle = '#ff8800';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Trail effect
                ctx.fillStyle = 'rgba(255, 255, 0, 0.3)';
                ctx.beginPath();
                ctx.arc(this.x - this.vx, this.y - this.vy, this.radius * 0.7, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Create players
        const player1 = new Tank(canvas.width * 0.0625, canvas.height * 0.1, '#00d4ff', 1);
        const player2 = new Tank(canvas.width * 0.8875, canvas.height * 0.82, '#ff00ea', 2);

        const bullets = [];

        // Touch event handlers
        const activeTouches = new Map();

        function handleTouchStart(e) {
            e.preventDefault();
            for (let touch of e.changedTouches) {
                const element = document.elementFromPoint(touch.clientX, touch.clientY);
                if (element) {
                    const dir = element.dataset.dir;
                    const fire = element.dataset.fire;

                    if (dir) {
                        touchControls[dir] = true;
                        element.classList.add('active');
                        activeTouches.set(touch.identifier, { element, type: 'dir', key: dir });
                    } else if (fire) {
                        touchControls[fire] = true;
                        element.classList.add('active');
                        activeTouches.set(touch.identifier, { element, type: 'fire', key: fire });
                    }
                }
            }
        }

        function handleTouchEnd(e) {
            e.preventDefault();
            for (let touch of e.changedTouches) {
                const touchData = activeTouches.get(touch.identifier);
                if (touchData) {
                    touchControls[touchData.key] = false;
                    touchData.element.classList.remove('active');
                    activeTouches.delete(touch.identifier);
                }
            }
        }

        function handleTouchMove(e) {
            e.preventDefault();
            for (let touch of e.changedTouches) {
                const element = document.elementFromPoint(touch.clientX, touch.clientY);
                const touchData = activeTouches.get(touch.identifier);

                if (touchData && element !== touchData.element) {
                    touchControls[touchData.key] = false;
                    touchData.element.classList.remove('active');

                    if (element && (element.dataset.dir || element.dataset.fire)) {
                        const key = element.dataset.dir || element.dataset.fire;
                        touchControls[key] = true;
                        element.classList.add('active');
                        activeTouches.set(touch.identifier, {
                            element,
                            type: element.dataset.dir ? 'dir' : 'fire',
                            key
                        });
                    } else {
                        activeTouches.delete(touch.identifier);
                    }
                }
            }
        }

        document.addEventListener('touchstart', handleTouchStart, { passive: false });
        document.addEventListener('touchend', handleTouchEnd, { passive: false });
        document.addEventListener('touchcancel', handleTouchEnd, { passive: false });
        document.addEventListener('touchmove', handleTouchMove, { passive: false });

        // Restart button
        document.getElementById('restartBtn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            resetGame();
        });

        function resetGame() {
            gameOver = false;
            winner = null;
            bullets.length = 0;

            player1.x = canvas.width * 0.0625;
            player1.y = canvas.height * 0.1;
            player1.health = 100;
            player1.angle = 0;
            player1.updateHealthDisplay();

            player2.x = canvas.width * 0.8875;
            player2.y = canvas.height * 0.82;
            player2.health = 100;
            player2.angle = 0;
            player2.updateHealthDisplay();

            document.getElementById('restartBtn').classList.remove('show');
        }

        function drawObstacles() {
            ctx.fillStyle = '#2a2a3a';
            ctx.strokeStyle = '#4a4a5a';
            ctx.lineWidth = 2;

            for (let obs of obstacles) {
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);

                ctx.fillStyle = '#3a3a4a';
                ctx.fillRect(obs.x + 5, obs.y + 5, obs.width - 10, obs.height - 10);
                ctx.fillStyle = '#2a2a3a';
            }
        }

        function drawGameOver() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = `bold ${canvas.width * 0.075}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const gradient = ctx.createLinearGradient(0, 0, canvas.width, 0);
            gradient.addColorStop(0, '#00d4ff');
            gradient.addColorStop(1, '#ff00ea');
            ctx.fillStyle = gradient;

            ctx.fillText(`${winner} WINS!`, canvas.width / 2, canvas.height / 2);
        }

        // Game loop
        function gameLoop() {
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid background
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            const gridSize = canvas.width * 0.05;
            for (let i = 0; i < canvas.width; i += gridSize) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i < canvas.height; i += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            drawObstacles();

            for (let i = bullets.length - 1; i >= 0; i--) {
                if (bullets[i].update()) {
                    bullets.splice(i, 1);
                } else {
                    bullets[i].draw();
                }
            }

            player1.update();
            player2.update();
            player1.draw();
            player2.draw();

            if (gameOver) {
                drawGameOver();
            }

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
